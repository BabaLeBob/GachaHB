
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon Équipe de Combat - Dynamique</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: white; padding: 20px; }
        .container { max-width: 1000px; margin: auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: #16213e; border: 2px solid #533483; padding: 15px; border-radius: 12px; cursor: pointer; text-align: center; transition: 0.3s; position: relative; }
        .card:hover { transform: translateY(-5px); border-color: #e94560; }
        .card.selected { border-color: #4ecca3; background: #0f3460; box-shadow: 0 0 15px rgba(78, 204, 163, 0.5); }
        .card.selected::after { content: '✔'; position: absolute; top: 10px; right: 10px; background: #4ecca3; color: white; border-radius: 50%; width: 25px; height: 25px; line-height: 25px; }
        
        .header-team { background: #e94560; padding: 20px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 10px; z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .team-count { font-size: 1.5em; font-weight: bold; }
        
        .btn-save { background: #4ecca3; color: #1a1a2e; border: none; padding: 12px 25px; border-radius: 5px; cursor: pointer; font-size: 1.1em; font-weight: bold; transition: 0.3s; }
        .btn-save:hover { background: #45b393; }
        .btn-save:disabled { background: #555; color: #888; cursor: not-allowed; }
        
        .stat-line { font-size: 0.85em; color: #aaa; margin-top: 8px; display: flex; justify-content: space-around; }
        .type-pill { background: #533483; padding: 2px 8px; border-radius: 4px; font-size: 0.8em; margin: 2px; display: inline-block; }
    </style>
</head>
<body>
<div class="container">
    <div class="header-team">
        <div class="team-count">Équipe : <span id="count">0</span> / 6</div>
        <button class="btn-save" id="save-btn" disabled onclick="saveTeam()">VALIDER L'ÉQUIPE</button>
    </div>
    
    <div class="grid" id="available-cards">
        <p>Chargement des cartes depuis cards_battle_data.json...</p>
    </div>
</div>

<script>
    let selectedCards = [];
    let fullCardsDatabase = {}; // Contiendra la fusion des stats et des noms

    async function loadCards() {
        const grid = document.getElementById('available-cards');
        try {
            // 1. Chargement des deux fichiers en parallèle[cite: 8]
            const [battleRes, shopRes] = await Promise.all([
                fetch('cards_battle_data.json'),
                fetch('shop.json')
            ]);

            if (!battleRes.ok || !shopRes.ok) throw new Error("Fichier JSON manquant");

            const battleData = await battleRes.json();
            const shopData = await shopRes.json();

            grid.innerHTML = ""; 

            // 2. Fusion des données pour chaque ID
            for (let id in battleData) {
                const stats = battleData[id];
                const info = shopData[id] || { nom: "Inconnu", img: "default.png" }; // Secours si l'ID manque dans shop.json

                // On stocke la fusion pour plus tard (sauvegarde équipe)
                fullCardsDatabase[id] = { ...stats, ...info };

                const div = document.createElement('div');
                div.className = 'card';
                div.id = `card-${id}`;
                
                let typesHtml = stats.types.map(t => `<span class="type-pill">${t}</span>`).join("");
                
                // Affichage utilisant le nom du shop.json
                div.innerHTML = `
                    <div style="font-size: 1.1em; font-weight: bold; margin-bottom: 5px;">${info.nom}</div>
                    <div style="font-size: 0.8em; color: #e94560; margin-bottom: 5px;">ID: ${id}</div>
                    <div>${typesHtml}</div>
                    <div class="stat-line">
                        <span>PV: ${stats.stats.hp}</span>
                        <span>ATK: ${stats.stats.atk}</span>
                        <span>VIT: ${stats.stats.spa}</span>
                        <span>PV: ${stats.stats.def}</span>
                        <span>ATK: ${stats.stats.spd}</span>
                        <span>VIT: ${stats.stats.spe}</span>
                    </div>
                `;
                
                div.onclick = () => toggleCard(id);
                grid.appendChild(div);
            }
        } catch (error) {
            grid.innerHTML = `<p style="color: #ff4d4d;">Erreur de chargement. Vérifiez que les deux fichiers JSON sont présents.</p>`;
            console.error(error);
        }
    }

    function toggleCard(id) {
        const index = selectedCards.indexOf(id);
        const cardDiv = document.getElementById(`card-${id}`);

        if (index > -1) {
            selectedCards.splice(index, 1);
            cardDiv.classList.remove('selected');
        } else if (selectedCards.length < 6) {
            selectedCards.push(id);
            cardDiv.classList.add('selected');
        }

        document.getElementById('count').textContent = selectedCards.length;
        document.getElementById('save-btn').disabled = (selectedCards.length === 0);
    }

    function saveTeam() {
        // Sauvegarde de l'équipe avec les noms et les stats fusionnés
        const teamToSave = selectedCards.map(id => ({
            id: id,
            ...fullCardsDatabase[id]
        }));
        
        localStorage.setItem('playerTeam', JSON.stringify(teamToSave));
        alert("Équipe validée avec les noms de shop.json !");
    }

    loadCards();
</script>
</body>
</html>

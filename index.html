<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GachaHB | Collection Royale</title>
    <style>
        :root { 
            --bg: #202225; --card-bg: #2f3136; --text: #ffffff; --accent: #5865f2; 
            --common: #b9bbbe; --rare: #43b581; --legend: #faa61a; --mythic: #f04747; --oracle: #ffee00; --secret: #eb459e;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        h1 { margin-bottom: 30px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }

        .search-box { background: var(--card-bg); padding: 25px; border-radius: 15px; display: inline-block; margin-bottom: 40px; box-shadow: 0 10px 20px rgba(0,0,0,0.4); }
        input { padding: 12px; border-radius: 8px; border: none; width: 250px; font-size: 16px; margin-right: 10px; }
        button { padding: 12px 25px; background: var(--accent); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.2s; }
        button:hover { background: #4752c4; transform: scale(1.05); }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 25px; max-width: 1300px; margin: 0 auto; }
        
        .card { 
            background: var(--card-bg); border-radius: 12px; padding: 15px; border: 1px solid #444; 
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); display: flex; flex-direction: column; 
        }
        .card:hover { transform: scale(1.03); border-color: var(--accent); box-shadow: 0 0 15px rgba(88, 101, 242, 0.4); }

        .card img { 
            width: 100%; height: 280px; object-fit: contain; border-radius: 8px; 
            background: #18191c; margin-bottom: 15px;
        }

        .card-name { font-size: 16px; font-weight: bold; margin-bottom: 8px; min-height: 40px; display: flex; align-items: center; justify-content: center; }
        
        .badge { font-size: 11px; font-weight: bold; padding: 4px 10px; border-radius: 20px; text-transform: uppercase; margin-bottom: 5px; color: #000; }
        .collection-tag { font-size: 10px; color: #b9bbbe; font-style: italic; margin-top: 5px; }

        /* Couleurs des raretés */
        .rarete-commun { background: var(--common); }
        .rarete-rare { background: var(--rare); color: white; }
        .rarete-legendaire { background: var(--legend); color: white; }
        .rarete-mythique { background: var(--mythic); color: white; }
        .rarete-oracle { background: var(--oracle); box-shadow: 0 0 10px #ffee00; }
        .rarete-secret { background: var(--secret); color: white; box-shadow: 0 0 10px #eb459e; }

        .status { margin-bottom: 20px; font-size: 18px; }
    </style>
</head>
<body>

    <h1>📜 GachaHB : Galerie des Joueurs</h1>
    
    <div class="search-box">
        <input type="text" id="username" placeholder="Pseudo Discord (ex: Bob)">
        <button onclick="displayCollection()">Ouvrir le grimoire</button>
    </div>

    <div id="status" class="status"></div>
    <div id="collectionGrid" class="grid"></div>

    <script>
        async function displayCollection() {
            const searchName = document.getElementById('username').value.trim().toLowerCase();
            const grid = document.getElementById('collectionGrid');
            const status = document.getElementById('status');

            if (!searchName) return;
            grid.innerHTML = "";
            status.innerText = "⏳ Lecture des parchemins...";

            try {
                const cb = "?t=" + Date.now();
                
                // 1. Charger les pseudos
                const resNames = await fetch('./noms.json' + cb);
                const namesData = await resNames.json();

                let userId = null;
                for (let id in namesData) {
                    if (namesData[id].toLowerCase() === searchName) {
                        userId = id;
                        break;
                    }
                }

                if (!userId) {
                    status.innerText = "❌ Ce voyageur est inconnu.";
                    return;
                }

                // 2. Charger les cartes possédées
                const resUser = await fetch('./user_cards.json' + cb);
                const userCards = await resUser.json();
                const myIds = userCards[userId] || [];

                // 3. Charger la base de données shop.json
                const resShop = await fetch('./shop.json' + cb);
                const shopData = await resShop.json();

                if (myIds.length === 0) {
                    status.innerText = "📭 Ce joueur ne possède aucune carte.";
                    return;
                }

                status.innerText = `✨ Collection de ${namesData[userId]} (${myIds.length} cartes)`;

                myIds.forEach(id => {
                    const info = shopData[id];
                    if (!info) return;

                    const cardDiv = document.createElement('div');
                    cardDiv.className = 'card';
                    
                    const rareteClass = "rarete-" + info.rarete.toLowerCase();
                    let finalPath = info.img.startsWith("Carte/") ? info.img : "Carte/" + info.img;

                    cardDiv.innerHTML = `
                        <img src="${finalPath}" onerror="this.src='https://via.placeholder.com/200x300?text=Image+Perdue'">
                        <div class="badge ${rareteClass}">${info.rarete}</div>
                        <div class="card-name">${info.nom}</div>
                        <div class="collection-tag">Série: ${info.collection}</div>
                        <div style="font-size:9px; color:#555; margin-top:5px;">ID: ${id}</div>
                    `;
                    grid.appendChild(cardDiv);
                });

            } catch (err) {
                status.innerText = "⚠️ Erreur de chargement. Le Bot a-t-il créé shop.json ?";
                console.error(err);
            }
        }
    </script>
</body>
</html>

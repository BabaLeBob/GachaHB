<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GachaHB | Ma Collection</title>
    <style>
        :root { --bg: #2f3136; --card-bg: #36393f; --text: #dcddde; --accent: #5865f2; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); text-align: center; padding: 20px; }
        .search-box { background: var(--card-bg); padding: 20px; border-radius: 10px; display: inline-block; margin-bottom: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        input { padding: 10px; border-radius: 5px; border: none; outline: none; width: 200px; }
        button { padding: 10px 20px; background: var(--accent); color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background: #4752c4; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; max-width: 1000px; margin: 0 auto; }
        .card { background: var(--card-bg); border-radius: 8px; padding: 10px; border: 1px solid #444; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); border-color: var(--accent); }
        .card img { width: 100%; border-radius: 5px; display: block; margin-bottom: 10px; min-height: 200px; background: #202225; }
        .card-id { font-size: 12px; color: #888; }
        .status { margin-bottom: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <h1>🎴 Ma Collection Gacha</h1>
    
    <div class="search-box">
        <input type="text" id="username" placeholder="Entre ton pseudo Discord">
        <button onclick="displayCollection()">Voir ma collection</button>
    </div>

    <div id="status" class="status"></div>
    <div id="collectionGrid" class="grid"></div>

    <script>
        async function displayCollection() {
            const searchName = document.getElementById('username').value.trim().toLowerCase();
            const grid = document.getElementById('collectionGrid');
            const status = document.getElementById('status');

            if (!searchName) return;

            grid.innerHTML = "";
            status.innerText = "⏳ Chargement...";

            try {
                const cb = "?t=" + Date.now();

                // Vérification noms.json
                const resNames = await fetch('./noms.json' + cb);
                if (!resNames.ok) throw new Error("Fichier noms.json introuvable sur GitHub");
                const namesData = await resNames.json();

                let userId = null;
                for (let id in namesData) {
                    if (namesData[id].toLowerCase() === searchName) {
                        userId = id;
                        break;
                    }
                }

                if (!userId) {
                    status.innerText = "❌ Pseudo non trouvé.";
                    return;
                }

                // Vérification user_cards.json
                const resUserCards = await fetch('./user_cards.json' + cb);
                if (!resUserCards.ok) throw new Error("Fichier user_cards.json introuvable");
                const userCards = await resUserCards.json();
                const myCardsIds = userCards[userId] || [];

                // Vérification shop.json (LE PLUS IMPORTANT)
                const resShop = await fetch('./shop.json' + cb);
                if (!resShop.ok) throw new Error("Fichier shop.json introuvable sur GitHub ! Lance ton bot pour le créer.");
                const shopData = await resShop.json();

                if (myCardsIds.length === 0) {
                    status.innerText = "📭 Aucune carte dans la collection.";
                    return;
                }

                status.innerText = `✅ ${myCardsIds.length} cartes trouvées !`;

                myCardsIds.forEach(id => {
                    const cardDiv = document.createElement('div');
                    cardDiv.className = 'card';
                    
                    // On récupère le chemin. Si l'ID n'existe pas dans shop.json, on affiche l'ID pour débugger
                    const imgPath = shopData[id];

                    if (!imgPath) {
                        cardDiv.innerHTML = `<div style="padding:20px; background:#444;">ID ${id} non listé dans shop.json</div>`;
                    } else {
                        cardDiv.innerHTML = `
                            <img src="./${imgPath}" alt="Carte ${id}" 
                                onerror="this.onerror=null; this.src='https://via.placeholder.com/200x300?text=Fichier+Introuvable';">
                            <div class="card-id">ID: ${id}</div>
                        `;
                    }
                    grid.appendChild(cardDiv);
                });

            } catch (err) {
                status.innerText = "⚠️ Erreur : " + err.message;
                console.error(err);
            }
        }
    </script>
</body>
</html>

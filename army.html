<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>GachaHB - Gestion d'Armée</title>
    <style>
        body { background: #1a1b1e; color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; text-align: center; overflow-x: hidden; }
        
        /* Overlay Connexion */
        #login-overlay { position: fixed; inset: 0; background: #1a1b1e; z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        input { padding: 12px; border-radius: 5px; border: none; width: 250px; margin-bottom: 10px; font-size: 1.1em; }
        
        .header { display: flex; justify-content: space-between; align-items: center; max-width: 900px; margin: 0 auto 20px; }
        
        /* Slots Armée */
        .army-slots {
            background: rgba(88, 101, 242, 0.1); border: 3px solid #5865f2; border-radius: 20px;
            padding: 20px; display: flex; justify-content: center; gap: 15px; min-height: 190px; margin-bottom: 40px;
        }

        .slot { width: 120px; height: 170px; border: 2px dashed rgba(255,255,255,0.1); border-radius: 10px; background: rgba(0,0,0,0.2); display: flex; align-items: center; justify-content: center; }

        /* Réserve */
        #reserve-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; max-width: 1000px; margin: 0 auto; }

        /* Cartes Optimisées */
        .card {
            width: 120px; height: 170px; background-size: contain; background-repeat: no-repeat; background-position: center;
            background-color: #2f3136; border: 2px solid #444; border-radius: 10px; cursor: pointer; transition: transform 0.1s;
            will-change: transform; /* Optimisation Lag */
        }
        .card:hover { transform: scale(1.05); border-color: #5865f2; }
        
        #tooltip { position: fixed; display: none; background: rgba(0,0,0,0.9); color: white; padding: 10px; border-radius: 5px; border: 1px solid #5865f2; z-index: 1000; pointer-events: none; width: 180px; font-size: 0.8em; }

        .btn-save { background: #43b581; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .user-info { color: #5865f2; font-weight: bold; }
    </style>
</head>
<body>

    <div id="login-overlay">
        <h2 style="color:#5865f2">IDENTIFICATION DISCORD</h2>
        <input type="text" id="pseudo-input" placeholder="Ton pseudo Discord...">
        <button class="btn-save" onclick="login()">ACCÉDER À MON ARMÉE</button>
    </div>

    <div class="header">
        <div>Utilisateur : <span id="current-user" class="user-info">...</span></div>
        <button class="btn-save" onclick="saveArmy()">💾 ENREGISTRER</button>
    </div>

    <div class="army-slots" id="army-slots"></div>

    <div style="text-align:left; max-width:900px; margin: 10px auto; color:#aaa;">MA RÉSERVE :</div>
    <div id="reserve-container"></div>

    <div id="tooltip"></div>

    <script>
        let fullShop = {}; 
        let allStats = {}; 
        let userInventory = []; // Cartes possédées par le joueur
        let selectedArmy = []; 
        let currentUser = "";
        const MAX_SLOTS = 5;

        // 1. CONNEXION
        function login() {
            const input = document.getElementById('pseudo-input').value.trim();
            if(!input) return alert("Entrez un pseudo !");
            
            currentUser = input;
            document.getElementById('current-user').innerText = currentUser;
            document.getElementById('login-overlay').style.display = "none";
            
            // On charge l'inventaire spécifique à ce pseudo
            // Note: Tu devras t'assurer que ton shop.js remplit bien 'inventaire_Pseudo'
            userInventory = JSON.parse(localStorage.getItem('inventaire_' + currentUser)) || [];
            selectedArmy = JSON.parse(localStorage.getItem('army_' + currentUser)) || [];
            
            initData();
        }

        async function initData() {
            const cb = "?t=" + Date.now();
            const [rS, rSt] = await Promise.all([fetch('shop.json'+cb), fetch('stats.json'+cb)]);
            fullShop = await rS.json();
            allStats = await rSt.json();
            render();
        }

        function render() {
            const slotContainer = document.getElementById('army-slots');
            const reserveContainer = document.getElementById('reserve-container');
            
            // Optimisation : On vide et on reconstruit proprement
            slotContainer.innerHTML = "";
            reserveContainer.innerHTML = "";

            // Rendu Slots
            for(let i=0; i < MAX_SLOTS; i++) {
                const slot = document.createElement('div');
                slot.className = "slot";
                if(selectedArmy[i]) {
                    slot.appendChild(createCard(selectedArmy[i], true));
                } else {
                    slot.innerHTML = "<small style='color:#333'>VIDE</small>";
                }
                slotContainer.appendChild(slot);
            }

            // Rendu Réserve (Seulement ce que le joueur possède)
            userInventory.forEach(id => {
                if(!selectedArmy.includes(id)) {
                    reserveContainer.appendChild(createCard(id, false));
                }
            });
        }

        function createCard(id, inArmy) {
            const data = fullShop[id];
            if(!data) return document.createElement('div');

            const card = document.createElement('div');
            card.className = "card";
            card.style.backgroundImage = `url('Carte/${data.img.replace('Carte/','')}')`;

            card.onclick = () => {
                if(inArmy) {
                    selectedArmy = selectedArmy.filter(sid => sid !== id);
                } else if(selectedArmy.length < MAX_SLOTS) {
                    selectedArmy.push(id);
                }
                render();
            };

            // Tooltip léger pour éviter le lag
            card.onmouseenter = () => { document.getElementById('tooltip').style.display = "block"; };
            card.onmousemove = (e) => {
                const tt = document.getElementById('tooltip');
                const s = allStats[id] || {};
                tt.style.left = (e.clientX + 10) + "px";
                tt.style.top = (e.clientY + 10) + "px";
                tt.innerHTML = `<b>${data.nom}</b><br>PV: ${s.hp} | ATK: ${s.atk}`;
            };
            card.onmouseleave = () => { document.getElementById('tooltip').style.display = "none"; };

            return card;
        }

        function saveArmy() {
            localStorage.setItem('army_' + currentUser, JSON.stringify(selectedArmy));
            // Important : On met aussi à jour le localStorage général pour le combat.html
            localStorage.setItem('myGachaArmy', JSON.stringify(selectedArmy));
            alert("Armée de " + currentUser + " enregistrée !");
        }
    </script>
</body>
</html>

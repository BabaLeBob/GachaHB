<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>GachaHB - Gestion d'Armée</title>
    <style>
        :root { --bg: #1a1b1e; --accent: #5865f2; --card-bg: #2f3136; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; text-align: center; }
        
        /* Overlay Connexion */
        #login-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        input { padding: 12px; border-radius: 8px; border: none; width: 250px; margin-bottom: 10px; font-size: 16px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; max-width: 900px; margin: 0 auto 20px; }
        
        /* Slots Armée */
        .army-slots {
            background: rgba(88, 101, 242, 0.1); border: 3px solid var(--accent); border-radius: 20px;
            padding: 20px; display: flex; justify-content: center; gap: 15px; min-height: 180px; margin-bottom: 40px;
        }
        .slot { width: 120px; height: 170px; border: 2px dashed rgba(255,255,255,0.1); border-radius: 10px; background: rgba(0,0,0,0.2); display: flex; align-items: center; justify-content: center; position: relative;}
        .slot-label { position: absolute; bottom: -20px; font-size: 10px; color: var(--accent); }

        /* Réserve */
        .reserve-title { text-align: left; max-width: 900px; margin: 10px auto; color: #aaa; font-size: 1.1em; border-left: 3px solid var(--accent); padding-left: 10px; }
        #reserve-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; max-width: 1000px; margin: 0 auto; }

        /* Cartes */
        .card {
            width: 120px; height: 170px; background-size: contain; background-repeat: no-repeat; background-position: center;
            background-color: var(--card-bg); border: 2px solid #444; border-radius: 10px; cursor: pointer; transition: 0.2s;
        }
        .card:hover { transform: scale(1.05); border-color: var(--accent); box-shadow: 0 0 10px rgba(88,101,242,0.5); }
        
        #tooltip { position: fixed; display: none; background: rgba(0,0,0,0.9); color: white; padding: 10px; border-radius: 5px; border: 1px solid var(--accent); z-index: 1000; pointer-events: none; width: 200px; font-size: 0.85em; }

        button { padding: 12px 25px; background: var(--accent); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button:hover { background: #4752c4; }
        .user-tag { background: var(--accent); padding: 5px 12px; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="login-overlay">
        <h1>📜 Accès aux Armées</h1>
        <input type="text" id="pseudo-input" placeholder="Pseudo Discord (ex: Bob)">
        <button onclick="login()">Ouvrir mon Grimoire</button>
        <p id="login-status" style="margin-top:15px; color: #f04747;"></p>
    </div>

    <div class="header">
        <a href="index.html" style="color:#aaa; text-decoration:none;">⬅ Menu</a>
        <div>Joueur : <span id="current-user" class="user-tag">...</span></div>
        <button onclick="saveArmy()">💾 SAUVEGARDER L'ARMÉE</button>
    </div>

    <h2 style="color:var(--accent)">MON ÉQUIPE (5 SLOTS)</h2>
    <div class="army-slots" id="army-slots"></div>

    <div class="reserve-title">MES CARTES DISPONIBLES</div>
    <div id="reserve-container"></div>

    <div id="tooltip"></div>

    <script>
        let fullShop = {}; 
        let allStats = {}; 
        let userInventory = []; 
        let selectedArmy = []; 
        let currentUser = "";
        let currentUserId = "";
        const MAX_SLOTS = 5;

        // Dictionnaire complet des descriptions de pouvoirs
        const powerDetails = {
            "none": "Aucune capacité spéciale.",
            "berserk": "Rage de combat : Augmente l'ATK de 40% quand les PV tombent sous la moitié.",
            "tank": "Blindage lourd : Réduit tous les dégâts subis de 25%.",
            "vampire": "Sangsue : Convertit 20% des dégâts infligés en soins pour soi-même.",
            "poison": "Lame toxique : Inflige des dégâts de poison (5 PV/sec) pendant 3 secondes à l'impact.",
            "burn": "Combustion : Enflamme l'ennemi. Le feu inflige 8 PV/sec et se propage aux alliés proches.",
            "aura_stop": "Champ de stase : Immobilise totalement les ennemis proches si l'unité est sous 50% PV.",
            "piercing": "Perçante : Ignore la réduction de dégâts des Tanks et leur inflige +25% de dégâts.",
            "frost": "Gelure : Réduit la vitesse de déplacement de l'ennemi de 50% à chaque impact.",
            "knockback": "Onde de choc : Repousse violemment l'ennemi en arrière à chaque tir réussi.",
            "phalanx": "Lien de phalange : Gagne +20% de défense pour chaque allié situé à proximité immédiate.",
            "turbo": "Post-combustion : Gagne un bonus de vitesse permanent à chaque fois qu'il rebondit.",
            "medic": "Zone de soin : Diffuse une onde curative qui soigne les alliés proches de 10 PV/sec.",
            "last_blast": "Dernier souffle : Provoque une détonation massive infligeant 100 dégâts à sa mort.",
            "sniper": "Précision : Inflige des dégâts doublés si la cible se trouve à plus de 300px."
        };

        async function login() {
            const input = document.getElementById('pseudo-input').value.trim().toLowerCase();
            const status = document.getElementById('login-status');
            if(!input) return;

            try {
                const cb = "?t=" + Date.now();
                const resNames = await fetch('./noms.json' + cb);
                const namesData = await resNames.json();

                for (let id in namesData) {
                    if (namesData[id].toLowerCase() === input) {
                        currentUserId = id;
                        currentUser = namesData[id];
                        break;
                    }
                }

                if (!currentUserId) {
                    status.innerText = "❌ Pseudo inconnu.";
                    return;
                }

                const resUser = await fetch('./user_cards.json' + cb);
                const userCards = await resUser.json();
                userInventory = userCards[currentUserId] || [];
                selectedArmy = JSON.parse(localStorage.getItem('army_' + currentUserId)) || [];
                
                document.getElementById('current-user').innerText = currentUser;
                document.getElementById('login-overlay').style.display = "none";
                initGameData();
            } catch (err) { console.error(err); }
        }

        async function initGameData() {
            const cb = "?t=" + Date.now();
            const [rS, rSt] = await Promise.all([fetch('shop.json'+cb), fetch('stats.json'+cb)]);
            fullShop = await rS.json();
            allStats = await rSt.json();
            render();
        }

        function render() {
            const slotContainer = document.getElementById('army-slots');
            const reserveContainer = document.getElementById('reserve-container');
            slotContainer.innerHTML = "";
            reserveContainer.innerHTML = "";

            for(let i=0; i < MAX_SLOTS; i++) {
                const slot = document.createElement('div');
                slot.className = "slot";
                if(selectedArmy[i]) {
                    slot.appendChild(createCard(selectedArmy[i], true));
                } else {
                    slot.innerHTML = `<span style="color:#333; font-size:12px;">SLOT VIDE</span>`;
                }
                slot.innerHTML += `<div class="slot-label">POSITION ${i+1}</div>`;
                slotContainer.appendChild(slot);
            }

            userInventory.forEach(id => {
                if(!selectedArmy.includes(id)) reserveContainer.appendChild(createCard(id, false));
            });
        }

        function createCard(id, inArmy) {
            const data = fullShop[id];
            const s = allStats[id] || {};
            if(!data) return document.createElement('div');

            const card = document.createElement('div');
            card.className = "card";
            card.style.backgroundImage = `url('Carte/${data.img.replace('Carte/','')}')`;

            card.onclick = () => {
                if(inArmy) selectedArmy = selectedArmy.filter(sid => sid !== id);
                else if(selectedArmy.length < MAX_SLOTS) selectedArmy.push(id);
                render();
            };

            card.onmousemove = (e) => {
                const tt = document.getElementById('tooltip');
                tt.style.display = "block";
                tt.style.left = (e.clientX + 15) + "px";
                tt.style.top = (e.clientY + 15) + "px";
                
                // Nettoyage du nom du pouvoir pour la description (enlève le _1, _2...)
                const rawPower = s.power || "none";
                const powerKey = rawPower.split('_')[0] === "aura" ? "aura_stop" : rawPower.split('_')[0];
                const desc = powerDetails[powerKey] || "Pouvoir inconnu.";

                tt.innerHTML = `
                    <b style="color:#5865f2; font-size:1.1em;">${data.nom}</b><br>
                    <div style="margin:5px 0; border-top:1px solid #444; padding-top:5px;">
                        ❤️ PV: <b>${s.hp}</b><br>
                        ⚔️ ATK: <b>${s.atk}</b><br>
                        🎯 Portée: <b>${s.rng}</b><br>
                        ⚡ Vitesse: <b>${s.spd}</b><br>
                        ⏱️ Cadence: <b>${s.as}ms</b>
                    </div>
                    <div style="color:#ffcc00; font-size:0.9em; margin-top:8px; border-top:1px dashed #666; padding-top:5px;">
                        <b>Pouvoir:</b> ${desc}
                    </div>
                `;
            };
            card.onmouseleave = () => { document.getElementById('tooltip').style.display = "none"; };

            return card;
        }

        function saveArmy() {
            localStorage.setItem('army_' + currentUserId, JSON.stringify(selectedArmy));
            localStorage.setItem('myGachaArmy', JSON.stringify(selectedArmy));
            alert("✅ Armée de " + currentUser + " enregistrée !");
        }
    </script>
</body>
</html>

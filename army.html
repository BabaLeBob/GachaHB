<!DOCTYPE html>
<html>
<head>
    <title>Mon Armée - GachaHB</title>
    <style>
        body { background: #2f3136; color: white; font-family: sans-serif; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; padding: 20px; }
        .card { border: 2px solid #444; padding: 5px; cursor: pointer; opacity: 0.6; }
        .selected { border-color: #5865f2; opacity: 1; transform: scale(1.05); background: #40444b; }
        img { width: 100%; height: 150px; object-fit: contain; }
    </style>
</head>
<body>
    <h1>🛡️ Compose ton Armée (5 cartes)</h1>
    <input type="text" id="username" placeholder="Ton pseudo">
    <button onclick="loadCollection()">Charger mes cartes</button>
    <div id="grid" class="grid"></div>
    <button onclick="saveArmy()" style="position:fixed; bottom:20px; right:20px; padding:20px; background:blue; color:white; border-radius:50px;">💾 SAUVEGARDER L'ARMÉE</button>

    <script>
        let myArmy = [];
        async function loadCollection() {
            const name = document.getElementById('username').value.toLowerCase();
            const resNames = await fetch('noms.json');
            const names = await resNames.json();
            const userID = Object.keys(names).find(id => names[id].toLowerCase() === name);
            
            const resUser = await fetch('user_cards.json');
            const userCards = await resUser.json();
            const myCards = userCards[userID] || [];

            const resShop = await fetch('shop.json');
            const shop = await resShop.json();

            const grid = document.getElementById('grid');
            grid.innerHTML = "";
            
            myCards.forEach(id => {
                const div = document.createElement('div');
                div.className = 'card';
                div.innerHTML = `<img src="Carte/${shop[id].img}"><br><small>${shop[id].nom}</small>`;
                div.onclick = () => toggleCard(id, div);
                grid.appendChild(div);
            });
        }

        function toggleCard(id, el) {
            if (myArmy.includes(id)) {
                myArmy = myArmy.filter(i => i !== id);
                el.classList.remove('selected');
            } else if (myArmy.length < 5) {
                myArmy.push(id);
                el.classList.add('selected');
            }
        }

        function saveArmy() {
            if(myArmy.length !== 5) return alert("Il faut exactement 5 cartes !");
            localStorage.setItem('myGachaArmy', JSON.stringify(myArmy));
            alert("Armée enregistrée dans ton navigateur !");
        }
    </script>
</body>
</html>

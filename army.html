<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>GachaHB - Gestion d'Armée (5 Slots)</title>
    <style>
        body { background: #1a1b1e; color: white; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 20px; text-align: center; }
        
        .header { display: flex; justify-content: space-between; align-items: center; max-width: 900px; margin: 0 auto 20px; }
        
        /* SECTION DU HAUT (L'ÉQUIPE - 5 SLOTS) */
        .army-slots {
            background: rgba(88, 101, 242, 0.1);
            border: 3px solid #5865f2;
            border-radius: 20px;
            padding: 25px;
            display: flex;
            justify-content: center;
            gap: 15px;
            min-height: 200px;
            margin-bottom: 40px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }

        .slot {
            width: 130px; height: 180px;
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 12px;
            background: rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .slot-label {
            position: absolute; bottom: -25px; font-size: 10px; color: #5865f2; font-weight: bold; letter-spacing: 1px;
        }

        /* SECTION DU BAS (RÉSERVE) */
        .reserve-title { font-size: 1.2em; color: #aaa; margin: 20px auto 15px; text-align: left; max-width: 900px; border-left: 4px solid #5865f2; padding-left: 10px; }
        
        #reserve-container {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 12px;
            max-width: 1000px; margin: 0 auto; padding-bottom: 50px;
        }

        /* STYLE DES CARTES */
        .card {
            width: 130px; height: 180px;
            background-size: contain; background-repeat: no-repeat; background-position: center;
            background-color: #2f3136; border: 2px solid #444; border-radius: 10px;
            cursor: pointer; transition: 0.2s ease; position: relative;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }
        .card:hover { transform: scale(1.05); border-color: #5865f2; box-shadow: 0 0 15px rgba(88, 101, 242, 0.5); z-index: 5; }
        
        .in-reserve { opacity: 0.9; }

        /* Tooltip */
        #tooltip {
            position: fixed; display: none; background: rgba(0, 0, 0, 0.95); color: white;
            padding: 12px; border-radius: 8px; border: 2px solid #5865f2; z-index: 1000;
            pointer-events: none; width: 220px; font-size: 0.9em; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        /* Boutons */
        .btn-save { background: #43b581; color: white; border: none; padding: 12px 30px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1em; box-shadow: 0 4px 0 #2d7d59; }
        .btn-save:hover { background: #4fd095; transform: translateY(-2px); }
        .btn-save:active { transform: translateY(2px); box-shadow: none; }
        .btn-back { color: #aaa; text-decoration: none; font-size: 0.9em; transition: 0.3s; }
        .btn-back:hover { color: white; }
    </style>
</head>
<body>

    <div class="header">
        <a href="index.html" class="btn-back">⬅ Menu Principal</a>
        <button class="btn-save" onclick="saveArmy()">💾 ENREGISTRER L'ARMÉE</button>
    </div>

    <h2 style="color:#5865f2; margin-bottom: 10px;">MON ÉQUIPE DE CHOC</h2>
    <div class="army-slots" id="army-slots">
        </div>

    <div class="reserve-title">RÉSERVE DES UNITÉS</div>
    <div id="reserve-container">
        </div>

    <div id="tooltip"></div>

    <script>
        let fullInventory = {}; 
        let allStats = {}; 
        let selectedIDs = []; 
        const MAX_SLOTS = 5; // Changé à 5 comme demandé

        // Descriptions courtes pour l'infobulle
        const powerNames = {
            "none":"Aucun", "berserk":"Berserk", "tank":"Tank", "vampire":"Vampire",
            "poison":"Poison 🤢", "burn":"Brûlure 🔥", "aura_stop":"Aura Stase 💜",
            "piercing":"Perçant 🎯", "frost":"Givre 🧊", "knockback":"Rétrograde",
            "phalanx":"Rempart 🏰", "turbo":"Turbo 💨", "medic":"Médic ✨",
            "last_blast":"Explosion 💣", "sniper":"Sniper"
        };

        async function init() {
            const cb = "?t=" + Date.now();
            try {
                const [rS, rSt] = await Promise.all([fetch('shop.json'+cb), fetch('stats.json'+cb)]);
                fullInventory = await rS.json();
                allStats = await rSt.json();
                
                selectedIDs = JSON.parse(localStorage.getItem('myGachaArmy')) || [];
                // On s'assure de ne pas dépasser 5 si l'ancien storage en avait 6
                if(selectedIDs.length > MAX_SLOTS) selectedIDs = selectedIDs.slice(0, MAX_SLOTS);
                
                render();
            } catch(e) { console.error("Erreur de chargement", e); }
        }

        function render() {
            const slotContainer = document.getElementById('army-slots');
            const reserveContainer = document.getElementById('reserve-container');
            slotContainer.innerHTML = "";
            reserveContainer.innerHTML = "";

            // 1. Rendu des 5 Slots
            for(let i=0; i < MAX_SLOTS; i++) {
                const slot = document.createElement('div');
                slot.className = "slot";
                
                if(selectedIDs[i]) {
                    const id = selectedIDs[i];
                    slot.appendChild(createCard(id, true));
                } else {
                    slot.innerHTML = `<span style="color:#444">SLOT ${i+1}</span>`;
                }
                
                const label = document.createElement('div');
                label.className = "slot-label";
                label.innerText = "POSITION " + (i+1);
                slot.appendChild(label);
                
                slotContainer.appendChild(slot);
            }

            // 2. Rendu de la réserve
            Object.keys(fullInventory).forEach(id => {
                if(!selectedIDs.includes(id)) {
                    reserveContainer.appendChild(createCard(id, false));
                }
            });
        }

        function createCard(id, inArmy) {
            const data = fullInventory[id];
            const s = allStats[id] || {};
            const card = document.createElement('div');
            card.className = "card" + (inArmy ? "" : " in-reserve");
            
            // Gestion propre de l'image
            let img = data.img.replace('Carte/', '');
            card.style.backgroundImage = `url('Carte/${img}')`;

            card.onclick = () => {
                if(inArmy) {
                    selectedIDs = selectedIDs.filter(sid => sid !== id);
                } else {
                    if(selectedIDs.length < MAX_SLOTS) {
                        selectedIDs.push(id);
                    } else {
                        alert("Votre armée est déjà au complet (5 unités) !");
                    }
                }
                render();
            };

            // Tooltip dynamique
            card.onmousemove = (e) => {
                const tt = document.getElementById('tooltip');
                tt.style.display = "block";
                tt.style.left = (e.clientX + 15) + "px";
                tt.style.top = (e.clientY + 15) + "px";
                
                let pKey = s.power ? s.power.split('_')[0] : "none";
                if(s.power && s.power.startsWith("aura_stop")) pKey = "aura_stop";
                
                tt.innerHTML = `
                    <b style="color:#5865f2; font-size:1.1em;">${data.nom}</b><br>
                    <hr style="border:0; border-top:1px solid #444; margin:5px 0;">
                    PV: <b>${s.hp}</b> | ATK: <b>${s.atk}</b><br>
                    SPD: <b>${s.spd}</b> | RNG: <b>${s.rng}</b><br>
                    <span style="color:#ffcc00;">✨ ${powerNames[pKey] || pKey}</span>
                `;
            };
            card.onmouseleave = () => document.getElementById('tooltip').style.display = "none";

            return card;
        }

        function saveArmy() {
            localStorage.setItem('myGachaArmy', JSON.stringify(selectedIDs));
            alert("✅ Armée enregistrée ! Les 5 héros sont prêts.");
        }

        init();
    </script>
</body>
</html>

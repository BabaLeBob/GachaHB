<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>GachaHB - Visual Chaos</title>
    <style>
        body { background: #1a1b1e; color: white; font-family: sans-serif; text-align: center; margin: 0; overflow: hidden; }
        #arena { 
            width: 1100px; height: 650px; background: #2f3136; margin: 15px auto; 
            position: relative; border: 5px solid #444; border-radius: 15px; overflow: hidden;
            background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 30px 30px;
        }
        .unit { 
            width: 60px; height: 60px; position: absolute; background-size: cover; 
            background-position: center; border-radius: 12px; border: 3px solid white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5); z-index: 2;
        }
        .team-player { border-color: #5865f2; }
        .team-enemy { border-color: #f04747; }
        
        /* --- EFFETS VISUELS --- */
        /* Bouclier Tank */
        .shield-fx {
            position: absolute; width: 80px; height: 80px; border: 2px solid rgba(0, 191, 255, 0.6);
            border-radius: 50%; top: -13px; left: -13px; pointer-events: none;
            background: rgba(0, 191, 255, 0.1); box-shadow: inset 0 0 15px rgba(0, 191, 255, 0.5);
            animation: pulse-shield 2s infinite; display: none;
        }
        @keyframes pulse-shield { 0% { transform: scale(1); opacity: 0.4; } 50% { transform: scale(1.05); opacity: 0.8; } 100% { transform: scale(1); opacity: 0.4; } }

        /* Aura Berserk */
        .berserk-fx {
            position: absolute; width: 60px; height: 60px; border-radius: 12px;
            box-shadow: 0 0 20px #ff0000; background: rgba(255, 0, 0, 0.2);
            top: 0; left: 0; pointer-events: none; display: none; animation: rage 0.5s infinite alternate;
        }
        @keyframes rage { from { opacity: 0.3; } to { opacity: 0.7; } }

        /* Vampire Heal */
        .vamp-fx {
            position: absolute; color: #43b581; font-weight: bold; font-size: 20px;
            pointer-events: none; animation: float-up 0.8s forwards; z-index: 10;
        }
        @keyframes float-up { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-40px); opacity: 0; } }

        .hp-container { position: absolute; top: -15px; width: 100%; height: 6px; background: #000; border-radius: 3px; }
        .hp-bar { height: 100%; background: #43b581; width: 100%; border-radius: 3px; transition: width 0.3s; }
        .bullet { position: absolute; width: 10px; height: 10px; background: #fff176; border-radius: 50%; box-shadow: 0 0 10px orange; z-index: 5; }
        .explosion { position: absolute; background: radial-gradient(circle, #ff5f00, transparent); border-radius: 50%; animation: blast 0.5s forwards; z-index: 1; }
        @keyframes blast { from { transform: scale(0); opacity: 1; } to { transform: scale(3); opacity: 0; } }
        
        button { padding: 12px 25px; font-size: 18px; cursor: pointer; background: #5865f2; color: white; border: none; border-radius: 5px; margin-top: 10px; }
    </style>
</head>
<body>

    <button onclick="initBattle()">LANCER LE CHAOS VISUEL</button>
    <div id="arena"></div>

    <script>
        let units = [];
        let battleActive = false;
        const UNIT_SIZE = 60;
        const ARENA_W = 1100, ARENA_H = 650;

        function getTier(p) { return (!p || p === "none") ? 0 : parseInt(p.split('_').pop()); }
        function getDist(a, b) { return Math.sqrt((a.x-b.x)**2 + (a.y-b.y)**2); }

        async function initBattle() {
            const arena = document.getElementById('arena');
            arena.innerHTML = ""; units = []; battleActive = false;
            const cb = "?t=" + Date.now();
            const [rS, rSt, rA] = await Promise.all([fetch('shop.json'+cb), fetch('stats.json'+cb), fetch('armies.json'+cb)]);
            const shop = await rS.json(), stats = await rSt.json(), armies = await rA.json();
            const myArmyIds = JSON.parse(localStorage.getItem('myGachaArmy')) || [];
            const enemyArmy = armies[Object.keys(armies)[0]].units;

            myArmyIds.forEach((id, i) => spawn(id, shop[id], stats[id], 150, 100 + (i*100), 'team-player'));
            enemyArmy.forEach((id, i) => spawn(id, shop[id], stats[id], 850, 100 + (i*100), 'team-enemy'));

            battleActive = true;
            requestAnimationFrame(update);
        }

        function spawn(id, base, stat, x, y, team) {
            if(!base || !stat) return;
            const u = {
                id, team, x, y, hp: stat.hp, maxHp: stat.hp, atk: stat.atk, baseAtk: stat.atk,
                range: stat.rng * 80, as: stat.as, spd: stat.spd, power: stat.power,
                vx: (Math.random()-0.5) * stat.spd, vy: (Math.random()-0.5) * stat.spd,
                lastAtk: 0, el: null, hpBar: null
            };

            const el = document.createElement('div');
            el.className = `unit ${team}`;
            let img = base.img.includes('/') ? base.img : 'Carte/' + base.img;
            el.style.backgroundImage = `url('${img}')`;
            
            // Ajout des conteneurs d'effets
            el.innerHTML = `
                <div class="hp-container"><div class="hp-bar"></div></div>
                <div class="shield-fx"></div>
                <div class="berserk-fx"></div>
            `;
            
            document.getElementById('arena').appendChild(el);
            u.el = el;
            u.hpBar = el.querySelector('.hp-bar');
            u.shieldEl = el.querySelector('.shield-fx');
            u.berserkEl = el.querySelector('.berserk-fx');
            
            // Afficher bouclier permanent si Tank
            if(u.power.startsWith("tank")) u.shieldEl.style.display = "block";
            
            units.push(u);
        }

        function update() {
            if(!battleActive) return;

            units.forEach(u => {
                if(u.hp <= 0) return;

                const tier = getTier(u.power);
                
                // 1. DÉPLACEMENT
                u.x += u.vx; 
                u.y += u.vy;

                // 2. REBONDS MURS (On force la vitesse initiale 'spd')
                if(u.x <= 0) {
                    u.x = 2;
                    u.vx = u.spd; // On réinjecte sa vitesse précise
                } else if(u.x >= ARENA_W - UNIT_SIZE) {
                    u.x = ARENA_W - UNIT_SIZE - 2;
                    u.vx = -u.spd;
                }

                if(u.y <= 0) {
                    u.y = 2;
                    u.vy = u.spd;
                } else if(u.y >= ARENA_H - UNIT_SIZE) {
                    u.y = ARENA_H - UNIT_SIZE - 2;
                    u.vy = -u.spd;
                }

                // 3. COLLISION UNITÉS (Calcul de rebond propre)
                units.forEach(o => {
                    if(o === u || o.hp <= 0) return;
                    let dx = o.x - u.x;
                    let dy = o.y - u.y;
                    let dist = Math.sqrt(dx*dx + dy*dy);

                    if(dist < UNIT_SIZE - 5) {
                        // On calcule l'angle de collision
                        let angle = Math.atan2(dy, dx);
                        
                        // On propulse les deux unités dans des directions opposées
                        // Mais on multiplie par leur PROPRE vitesse (u.spd et o.spd)
                        u.vx = -Math.cos(angle) * u.spd;
                        u.vy = -Math.sin(angle) * u.spd;
                        
                        o.vx = Math.cos(angle) * o.spd;
                        o.vy = Math.sin(angle) * o.spd;

                        // Anti-chevauchement (on les écarte pour éviter qu'ils restent collés)
                        let overlap = UNIT_SIZE - dist;
                        u.x -= Math.cos(angle) * (overlap / 2);
                        u.y -= Math.sin(angle) * (overlap / 2);
                        o.x += Math.cos(angle) * (overlap / 2);
                        o.y += Math.sin(angle) * (overlap / 2);
                    }
                });

                // 4. BERSERK & COMBAT
                if(u.power.startsWith("berserk")) {
                    if(u.hp < u.maxHp * 0.4) {
                        u.atk = u.baseAtk * (1 + tier*0.33);
                        u.berserkEl.style.display = "block";
                    } else {
                        u.atk = u.baseAtk;
                        u.berserkEl.style.display = "none";
                    }
                }

                let enemies = units.filter(e => e.team !== u.team && e.hp > 0);
                let target = enemies.sort((a,b) => getDist(u,a) - getDist(u,b))[0];
                if(target && getDist(u, target) <= u.range) {
                    if(Date.now() - u.lastAtk > u.as) {
                        shoot(u, target);
                        u.lastAtk = Date.now();
                    }
                }

                // Mise à jour visuelle
                u.el.style.left = u.x + "px";
                u.el.style.top = u.y + "px";
            });

            // FIN DE PARTIE
            const pAlive = units.filter(u=>u.team==='team-player' && u.hp>0).length;
            const eAlive = units.filter(u=>u.team==='team-enemy' && u.hp>0).length;
            if(pAlive === 0 || eAlive === 0) {
                battleActive = false;
                alert(pAlive === 0 ? "DÉFAITE !" : "VICTOIRE !");
                location.reload();
            }

            if(battleActive) requestAnimationFrame(update);
        }

        function shoot(u, t) {
            const b = document.createElement('div');
            b.className = "bullet";
            b.style.left = (u.x+25)+"px"; b.style.top = (u.y+25)+"px";
            document.getElementById('arena').appendChild(b);

            let start = Date.now(), duration = 250;
            let startX = u.x+25, startY = u.y+25;

            function anim() {
                let p = (Date.now() - start) / duration;
                if(p >= 1) { b.remove(); hit(u, t); }
                else {
                    b.style.left = (startX + (t.x+25 - startX) * p) + "px";
                    b.style.top = (startY + (t.y+25 - startY) * p) + "px";
                    requestAnimationFrame(anim);
                }
            }
            requestAnimationFrame(anim);
        }

        function hit(u, t) {
            if(t.hp <= 0) return;
            let d = u.atk;
            const uT = getTier(u.power), tT = getTier(t.power);

            if(u.power.startsWith("sniper") && getDist(u, t) > 250) d *= (1 + uT*0.5);
            if(t.power.startsWith("tank")) d *= (1 - tT*0.2);

            t.hp -= d;
            
            // Vampire FX
            if(u.power.startsWith("vampire")) {
                let heal = d * (uT*0.15);
                u.hp = Math.min(u.maxHp, u.hp + heal);
                showVampireHeal(u, Math.round(heal));
            }

            t.hpBar.style.width = (Math.max(0, t.hp/t.maxHp*100)) + "%";
            u.hpBar.style.width = (Math.max(0, u.hp/u.maxHp*100)) + "%";

            if(t.hp <= 0) {
                t.el.style.display = "none";
                if(t.power.startsWith("last_blast")) explode(t);
            }
        }

        function showVampireHeal(u, val) {
            const v = document.createElement('div');
            v.className = "vamp-fx";
            v.innerText = "+" + val;
            v.style.left = u.x + "px"; v.style.top = u.y + "px";
            document.getElementById('arena').appendChild(v);
            setTimeout(() => v.remove(), 800);
        }

        function explode(u) {
            const tier = getTier(u.power);
            const ex = document.createElement('div');
            ex.className = "explosion";
            ex.style.width = ex.style.height = (tier*100)+"px";
            ex.style.left = (u.x - tier*20)+"px"; ex.style.top = (u.y - tier*20)+"px";
            document.getElementById('arena').appendChild(ex);
            units.forEach(o => {
                if(o.team !== u.team && o.hp > 0 && getDist(u, o) < tier*100) {
                    o.hp -= 30 * tier;
                    o.hpBar.style.width = (Math.max(0, o.hp/o.maxHp*100)) + "%";
                    if(o.hp <= 0) o.el.style.display = "none";
                }
            });
            setTimeout(() => ex.remove(), 500);
        }

        function end(m) { battleActive = false; alert(m); location.reload(); }
    </script>
</body>
</html>

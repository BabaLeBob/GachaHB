<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>GachaHB | Arène de Combat</title>
    <style>
        :root { --bg: #202225; --arena-bg: #36393f; --accent: #5865f2; --enemy: #f04747; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; overflow-x: hidden; }
        
        #battle-ui { padding: 20px; }
        
        /* L'ARÈNE */
        #arena { 
            width: 900px; height: 500px; background: var(--arena-bg); 
            margin: 0 auto; position: relative; border: 5px solid #444; border-radius: 10px;
            background-image: radial-gradient(#4f545c 1px, transparent 1px);
            background-size: 30px 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* LES UNITÉS */
        .unit { 
            width: 60px; height: 60px; position: absolute; transition: transform 0.1s linear;
            background-size: cover; background-position: center; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            z-index: 2; box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }
        .team-player { border: 3px solid var(--accent); }
        .team-enemy { border: 3px solid var(--enemy); }

        /* BARRES DE VIE */
        .hp-container { 
            position: absolute; top: -15px; left: 0; width: 100%; height: 6px; 
            background: #000; border-radius: 3px; overflow: hidden;
        }
        .hp-bar { height: 100%; background: #43b581; width: 100%; transition: width 0.2s; }
        .unit-name { position: absolute; bottom: -18px; width: 100px; font-size: 10px; white-space: nowrap; }

        /* PROJECTILES (EFFET ATTAQUE) */
        .bullet { position: absolute; width: 8px; height: 8px; background: yellow; border-radius: 50%; z-index: 10; }

        /* LOGS ET BOUTONS */
        .log-box { 
            width: 900px; height: 120px; background: #000; margin: 20px auto; 
            border-radius: 8px; padding: 10px; overflow-y: auto; text-align: left;
            font-family: monospace; color: #00ff00; border: 1px solid #333;
        }
        button { 
            padding: 15px 40px; font-size: 18px; background: var(--accent); 
            color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;
        }
        button:hover { background: #4752c4; transform: scale(1.05); }
        button:disabled { background: #444; cursor: not-allowed; }
    </style>
</head>
<body>

    <div id="battle-ui">
        <h1>⚔️ ARÈNE DE COMBAT ⚔️</h1>
        <button id="start-btn" onclick="initBattle()">LANCER LE COMBAT</button>
    </div>

    <div id="arena"></div>

    <div class="log-box" id="logs">
        > Prêt pour le combat...<br>
        > Assure-toi d'avoir créé ton armée sur la page Army.
    </div>

    <script>
        let units = [];
        let battleActive = false;
        let loop;

        async function initBattle() {
            const btn = document.getElementById('start-btn');
            const arena = document.getElementById('arena');
            const logBox = document.getElementById('logs');
            
            // Nettoyage
            arena.innerHTML = "";
            logBox.innerHTML = "> Recherche d'un adversaire...<br>";
            units = [];
            btn.disabled = true;

            try {
                // 1. Chargement des données
                const [resShop, resStats, resArmies] = await Promise.all([
                    fetch('shop.json'),
                    fetch('stats.json'),
                    fetch('armies.json')
                ]);

                const shop = await resShop.json();
                const stats = await resStats.json();
                const armies = await resArmies.json();

                // 2. Récupérer l'armée du joueur (LocalStorage)
                const playerArmyIds = JSON.parse(localStorage.getItem('myGachaArmy'));
                if (!playerArmyIds || playerArmyIds.length === 0) {
                    alert("Ton armée est vide ! Va sur army.html d'abord.");
                    btn.disabled = false;
                    return;
                }

                // 3. Choisir un adversaire aléatoire dans armies.json
                const armyKeys = Object.keys(armies);
                const randomOppID = armyKeys[Math.floor(Math.random() * armyKeys.length)];
                const enemyArmyIds = armies[randomOppID].units;
                const enemyName = armies[randomOppID].pseudo;

                logBox.innerHTML += `> Match trouvé : VS <b>${enemyName}</b><br>`;

                // 4. Placement des unités
                setupUnits(playerArmyIds, shop, stats, 100, 'team-player');
                setupUnits(enemyArmyIds, shop, stats, 750, 'team-enemy');

                battleActive = true;
                startLoop();

            } catch (err) {
                console.error(err);
                logBox.innerHTML += "⚠️ Erreur : Impossible de charger les données.<br>";
                btn.disabled = false;
            }
        }

        function setupUnits(ids, shop, stats, startX, team) {
            ids.forEach((id, i) => {
                const card = shop[id];
                const s = stats[id] || { hp: 50, atk: 10, rng: 1 }; // Stats par défaut
                
                const unitData = {
                    id: id,
                    name: card.nom,
                    team: team,
                    hp: s.hp,
                    maxHp: s.hp,
                    atk: s.atk,
                    range: s.rng * 60, // Conversion portée
                    x: startX,
                    y: 80 + (i * 80),
                    lastAtk: 0,
                    img: card.img.startsWith("Carte/") ? card.img : "Carte/" + card.img
                };

                // Création visuelle
                const el = document.createElement('div');
                el.className = `unit ${team}`;
                el.style.backgroundImage = `url('${unitData.img}')`;
                el.style.left = unitData.x + "px";
                el.style.top = unitData.y + "px";
                el.innerHTML = `
                    <div class="hp-container"><div class="hp-bar"></div></div>
                    <div class="unit-name">${unitData.name}</div>
                `;
                
                document.getElementById('arena').appendChild(el);
                unitData.el = el;
                unitData.hpBar = el.querySelector('.hp-bar');
                units.push(unitData);
            });
        }

        function startLoop() {
            clearInterval(loop);
            loop = setInterval(() => {
                if (!battleActive) return;

                units.forEach(u => {
                    if (u.hp <= 0) return;

                    // Chercher l'ennemi le plus proche
                    let targets = units.filter(en => en.team !== u.team && en.hp > 0);
                    if (targets.length === 0) {
                        endBattle(u.team);
                        return;
                    }

                    let target = targets.sort((a, b) => getDist(u, a) - getDist(u, b))[0];
                    let d = getDist(u, target);

                    if (d > u.range) {
                        // DÉPLACEMENT
                        let speed = 2.5;
                        u.x += (target.x > u.x ? 1 : -1) * speed;
                        u.y += (target.y > u.y ? 1 : -1) * speed;
                        u.el.style.left = u.x + "px";
                        u.el.style.top = u.y + "px";
                    } else {
                        // ATTAQUE (toutes les 1 seconde environ)
                        let now = Date.now();
                        if (now - u.lastAtk > 1000) {
                            attack(u, target);
                            u.lastAtk = now;
                        }
                    }
                });
            }, 50);
        }

        function attack(attacker, target) {
            // Petit effet visuel de projectile
            const bullet = document.createElement('div');
            bullet.className = "bullet";
            bullet.style.left = attacker.x + 30 + "px";
            bullet.style.top = attacker.y + 30 + "px";
            document.getElementById('arena').appendChild(bullet);

            // Animation simple
            setTimeout(() => {
                bullet.style.left = target.x + 30 + "px";
                bullet.style.top = target.y + 30 + "px";
                bullet.style.transition = "0.2s";
            }, 10);

            setTimeout(() => {
                bullet.remove();
                target.hp -= attacker.atk;
                let hpPercent = (target.hp / target.maxHp) * 100;
                target.hpBar.style.width = Math.max(0, hpPercent) + "%";

                if (target.hp <= 0) {
                    target.el.style.opacity = "0.3";
                    target.el.style.filter = "grayscale(1)";
                    document.getElementById('logs').innerHTML += `> 💀 <b>${target.name}</b> a succombé.<br>`;
                    document.getElementById('logs').scrollTop = 9999;
                }
            }, 200);
        }

        function getDist(a, b) {
            return Math.sqrt(Math.pow(a.x - b.x, 2) + Math.pow(a.y - b.y, 2));
        }

        function endBattle(winningTeam) {
            battleActive = false;
            clearInterval(loop);
            const winner = winningTeam === 'team-player' ? "VICTOIRE !" : "DÉFAITE...";
            document.getElementById('logs').innerHTML += `<br><b style="font-size:20px; color:yellow;">🏁 ${winner}</b><br>`;
            document.getElementById('start-btn').disabled = false;
        }
    </script>
</body>
</html>

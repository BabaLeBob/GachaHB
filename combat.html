<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>GachaHB | Arène Tactique v2</title>
    <style>
        :root { --bg: #1a1b1e; --arena-bg: #2f3136; --accent: #5865f2; --enemy: #f04747; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; overflow-x: hidden; }
        #battle-ui { padding: 15px; }
        #arena { 
            width: 1200px; height: 700px; background: var(--arena-bg); 
            margin: 0 auto; position: relative; border: 6px solid #444; border-radius: 12px;
            background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 40px 40px; box-shadow: 0 15px 40px rgba(0,0,0,0.6); overflow: hidden;
        }
        .unit { 
            width: 65px; height: 65px; position: absolute; background-size: cover; 
            background-position: center; border-radius: 10px; z-index: 2; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center;
        }
        .team-player { border: 3px solid var(--accent); }
        .team-enemy { border: 3px solid var(--enemy); }
        .hp-container { position: absolute; top: -18px; left: 0; width: 100%; height: 7px; background: #000; border-radius: 4px; overflow: hidden; border: 1px solid #111; }
        .hp-bar { height: 100%; background: #43b581; width: 100%; transition: width 0.3s; }
        .unit-name { position: absolute; bottom: -25px; width: 140px; font-size: 11px; font-weight: bold; text-shadow: 1px 1px 3px black; pointer-events: none; }
        .bullet { position: absolute; width: 12px; height: 12px; background: #fff176; border-radius: 50%; z-index: 10; box-shadow: 0 0 10px #ffa000; }
        .log-box { width: 1200px; height: 80px; background: rgba(0,0,0,0.8); margin: 15px auto; border-radius: 8px; padding: 10px; overflow-y: auto; text-align: left; font-family: monospace; color: #00ff00; border: 1px solid #333; font-size: 14px; }
        button { padding: 12px 40px; font-size: 20px; background: var(--accent); color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div id="battle-ui">
        <h1>⚔️ ARÈNE TACTIQUE GACHAHB ⚔️</h1>
        <button id="start-btn" onclick="initBattle()">LANCER LA SIMULATION</button>
    </div>

    <div id="arena"></div>
    <div class="log-box" id="logs">> En attente des données de combat...</div>

    <script>
        let units = [];
        let battleActive = false;
        let loop;
        const UNIT_SIZE = 65;
        const ARENA_W = 1200;
        const ARENA_H = 700;

        async function initBattle() {
            const btn = document.getElementById('start-btn');
            const arena = document.getElementById('arena');
            arena.innerHTML = "";
            units = [];
            btn.disabled = true;

            try {
                const cb = "?t=" + Date.now();
                const [resShop, resStats, resArmies] = await Promise.all([
                    fetch('shop.json' + cb), fetch('stats.json' + cb), fetch('armies.json' + cb)
                ]);

                const shop = await resShop.json();
                const stats = await resStats.json();
                const armies = await resArmies.json();

                const playerArmyIds = JSON.parse(localStorage.getItem('myGachaArmy'));
                if (!playerArmyIds) return alert("Fais ton armée sur army.html !");

                const armyKeys = Object.keys(armies);
                const enemy = armies[armyKeys[Math.floor(Math.random() * armyKeys.length)]];

                setupUnits(playerArmyIds, shop, stats, 150, 'team-player');
                setupUnits(enemy.units, shop, stats, 1000, 'team-enemy');

                document.getElementById('logs').innerHTML = `> Combat : VS <b>${enemy.pseudo}</b> !`;
                battleActive = true;
                startLoop();
            } catch (err) { console.error(err); btn.disabled = false; }
        }

        function setupUnits(ids, shop, stats, startX, team) {
            ids.forEach((id) => {
                const card = shop[id];
                if (!card) return;
                
                // NOUVELLES STATS : spd (vitesse) et as (attack speed)
                const s = stats[id] || { hp: 100, atk: 15, rng: 2, spd: 2, as: 1000 };
                
                const angle = Math.random() * Math.PI * 2;
                const unitSpd = s.spd || 2; 

                const unitData = {
                    id: id, name: card.nom, team: team, 
                    hp: s.hp, maxHp: s.hp, atk: s.atk,
                    range: (s.rng || 2) * 80,
                    attackSpeed: s.as || 1000, // Temps entre 2 tirs
                    moveSpeed: unitSpd,        // Vitesse de base
                    x: startX + (Math.random() * 60 - 30),
                    y: Math.floor(Math.random() * (ARENA_H - 150)) + 75,
                    vx: Math.cos(angle) * unitSpd,
                    vy: Math.sin(angle) * unitSpd,
                    lastAtk: 0,
                    img: card.img.startsWith("Carte/") ? card.img : "Carte/" + card.img
                };

                const el = document.createElement('div');
                el.className = `unit ${team}`;
                el.style.backgroundImage = `url('${unitData.img}')`;
                if(team === 'team-enemy') el.style.transform = "scaleX(-1)";
                el.innerHTML = `<div class="hp-container"><div class="hp-bar"></div></div><div class="unit-name">${unitData.name}</div>`;
                
                document.getElementById('arena').appendChild(el);
                unitData.el = el;
                unitData.hpBar = el.querySelector('.hp-bar');
                units.push(unitData);
                updatePos(unitData);
            });
        }

        function startLoop() {
            clearInterval(loop);
            loop = setInterval(() => {
                if (!battleActive) return;

                units.forEach(u => {
                    if (u.hp <= 0) return;

                    let enemies = units.filter(en => en.team !== u.team && en.hp > 0);
                    let target = enemies.sort((a,b) => getDist(u,a) - getDist(u,b))[0];

                    // LOGIQUE ATTAQUE
                    if (target && getDist(u, target) <= u.range) {
                        // On freine pour tirer
                        u.vx *= 0.6; u.vy *= 0.6;
                        if (Date.now() - u.lastAtk > u.attackSpeed) {
                            attack(u, target);
                            u.lastAtk = Date.now();
                        }
                    } else {
                        // Maintien de la vitesse de déplacement personnalisée
                        let currentSpeed = Math.sqrt(u.vx**2 + u.vy**2);
                        if(currentSpeed < u.moveSpeed) {
                            u.vx += (Math.random() - 0.5) * 0.5;
                            u.vy += (Math.random() - 0.5) * 0.5;
                        }
                    }

                    // PHYSIQUE
                    u.x += u.vx; u.y += u.vy;

                    // Rebond Murs
                    if (u.x <= 0 || u.x >= ARENA_W - UNIT_SIZE) u.vx *= -1;
                    if (u.y <= 0 || u.y >= ARENA_H - UNIT_SIZE) u.vy *= -1;

                    // Rebond entre personnages (avec transfert de force selon vitesse)
                    units.forEach(other => {
                        if (other === u || other.hp <= 0) return;
                        let d = getDist(u, other);
                        if (d < UNIT_SIZE - 5) {
                            let tvx = u.vx; let tvy = u.vy;
                            u.vx = other.vx; u.vy = other.vy;
                            other.vx = tvx; other.vy = tvy;
                            u.x -= (other.x - u.x) * 0.1; // Évite de coller
                        }
                    });

                    u.x = Math.max(0, Math.min(ARENA_W - UNIT_SIZE, u.x));
                    u.y = Math.max(0, Math.min(ARENA_H - UNIT_SIZE, u.y));
                    updatePos(u);
                });

                if(units.filter(u => u.team === 'team-player' && u.hp > 0).length === 0) endBattle('DÉFAITE');
                if(units.filter(u => u.team === 'team-enemy' && u.hp > 0).length === 0) endBattle('VICTOIRE');
            }, 30);
        }

        function attack(attacker, target) {
            const b = document.createElement('div');
            b.className = "bullet";
            b.style.left = (attacker.x + 30) + "px";
            b.style.top = (attacker.y + 30) + "px";
            document.getElementById('arena').appendChild(b);

            setTimeout(() => {
                b.style.left = (target.x + 30) + "px";
                b.style.top = (target.y + 30) + "px";
                b.style.transition = "0.25s linear";
            }, 20);

            setTimeout(() => {
                b.remove();
                if (target.hp > 0) {
                    target.hp -= attacker.atk;
                    target.hpBar.style.width = Math.max(0, (target.hp / target.maxHp * 100)) + "%";
                    if(target.hp <= 0) {
                        target.el.style.opacity = "0.2";
                        target.el.style.filter = "grayscale(1)";
                    }
                }
            }, 270);
        }

        function updatePos(u) { u.el.style.left = u.x + "px"; u.el.style.top = u.y + "px"; }
        function getDist(a, b) { return Math.sqrt(Math.pow(a.x - b.x, 2) + Math.pow(a.y - b.y, 2)); }
        function endBattle(res) {
            battleActive = false;
            clearInterval(loop);
            document.getElementById('logs').innerHTML += `<br><b style="font-size:20px; color:yellow;">🏁 ${res}</b>`;
            document.getElementById('start-btn').disabled = false;
        }
    </script>
</body>
</html>


<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Simulateur de Combat Gacha V2</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0b0b18; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        #battle-arena { width: 850px; height: 450px; background: #16213e; border: 5px solid #533483; position: relative; border-radius: 20px; box-shadow: 0 0 30px rgba(0,0,0,0.8); overflow: hidden; }
        
        .fighter { width: 220px; position: absolute; text-align: center; transition: all 0.4s ease; }
        #player-active { bottom: 40px; left: 80px; }
        #cpu-active { top: 40px; right: 80px; }
        
        .hp-container { background: rgba(0,0,0,0.8); padding: 10px; border-radius: 10px; border: 1px solid #533483; }
        .hp-bar { width: 100%; height: 12px; background: #444; border-radius: 6px; overflow: hidden; margin-top: 5px; }
        .hp-inner { height: 100%; background: #00ff88; width: 100%; transition: width 0.5s ease; }
        
        .sprite { font-size: 80px; filter: drop-shadow(2px 4px 6px black); margin: 10px 0; }
        
        #log { width: 850px; height: 120px; background: rgba(0,0,0,0.9); border: 2px solid #533483; margin-top: 15px; padding: 15px; overflow-y: auto; font-family: 'Courier New', monospace; color: #00ffcc; font-size: 0.9em; box-sizing: border-box; }
        
        .controls { margin-top: 15px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 850px; }
        .atk-btn { padding: 15px; background: #16213e; border: 2px solid #e94560; color: white; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1em; }
        .atk-btn:hover { background: #e94560; transform: translateY(-2px); }
        .atk-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .type-badge { font-size: 0.7em; padding: 2px 5px; border-radius: 4px; margin-left: 5px; background: #533483; text-transform: uppercase; }
    </style>
</head>
<body>
    <h1>Arène de Combat Gacha</h1>

    <div id="battle-arena">
        <div id="cpu-active" class="fighter">
            <div class="hp-container">
                <strong id="cpu-name">ORDINATEUR</strong>
                <div class="hp-bar"><div id="cpu-hp" class="hp-inner"></div></div>
                <small id="cpu-hp-text">100/100 PV</small>
            </div>
            <div class="sprite">👹</div>
        </div>

        <div id="player-active" class="fighter">
            <div class="sprite">⚔️</div>
            <div class="hp-container">
                <strong id="player-name">JOUEUR</strong>
                <div class="hp-bar"><div id="player-hp" class="hp-inner"></div></div>
                <small id="player-hp-text">100/100 PV</small>
            </div>
        </div>
    </div>

    <div id="log">Initialisation des systèmes élémentaires...</div>

    <div class="controls" id="move-container"></div>

<script>
    const typeTable = {"Poing": {"glace": 2, "roche": 0.5}, "Tranche": {"Poing": 2, "Feu": 0.5, "plante": 2, "roche": 0.5, "electrique": 0.5}, "Feu": {"Tranche": 2, "Feu": 0.5, "glace": 2, "plante": 2, "Eau": 0.5, "roche": 0.5, "Poison": 0.5}, "glace": {"Feu": 0.5, "glace": 0.5, "Eau": 2, "roche": 2, "electrique": 2, "Poison": 0.5}, "plante": {"Feu": 0.5, "glace": 0.5, "plante": 2, "Eau": 0.5, "roche": 2, "electrique": 2, "Poison": 2}, "Eau": {"glace": 2, "plante": 0.5, "Eau": 0.5, "roche": 0.5, "Poison": 2}, "roche": {"Poing": 2, "Tranche": 2, "glace": 2, "plante": 0.5, "Eau": 0.5, "roche": 0.5, "electrique": 0.5}, "electrique": {"plante": 0.5, "Eau": 2, "roche": 0.5, "electrique": 0.5, "t\u00e9n\u00e8bre": 2, "Poison": 2}, "t\u00e9n\u00e8bre": {"Poing": 2, "glace": 0.5, "electrique": 0.5, "t\u00e9n\u00e8bre": 2, "Poison": 2}, "Poison": {"Feu": 2, "glace": 0.5, "plante": 0.5, "t\u00e9n\u00e8bre": 2, "Poison": 0.5}};
    
    // Données fictives pour test (à remplacer par ton JSON)
    const movesDB = {
        "A01": { nom: "Coup de Poing", puissance: 40, type: "Poing", cat: "Physique" },
        "A02": { nom: "Tranche-Nuit", puissance: 70, type: "Tranche", cat: "Physique" },
        "A03": { nom: "Boule de Feu", puissance: 90, type: "Feu", cat: "Special" },
        "A04": { nom: "Éclair Noir", puissance: 80, type: "electrique", cat: "Special" }
    };

    let pState = { hp: 150, maxHp: 150, stats: { atk: 100, def: 80, spa: 110, spd: 90 }, types: ["Feu", "Poing"], moves: ["A01", "A03"] };
    let cState = { hp: 140, maxHp: 140, stats: { atk: 90, def: 100, spa: 70, spd: 110 }, types: ["glace"], moves: ["A02"] };

    function addLog(msg, color = "#00ffcc") {
        const log = document.getElementById('log');
        log.innerHTML += `<div style="color: ${color}">> ${msg}</div>`;
        log.scrollTop = log.scrollHeight;
    }

    function calculateDamage(move, atk, def) {
        const aStat = move.cat === "Physique" ? atk.stats.atk : atk.stats.spa;
        const dStat = move.cat === "Physique" ? def.stats.def : def.stats.spd;
        
        let base = Math.floor(((move.puissance * aStat) / dStat) / 2);
        let multi = 1.0;

        def.types.forEach(tDef => {
            if (typeTable[move.type] && typeTable[move.type][tDef]) {
                multi *= typeTable[move.type][tDef];
            }
        });

        return { total: Math.max(1, Math.floor(base * multi)), multi };
    }

    function updateUI() {
        document.getElementById('player-hp').style.width = (pState.hp / pState.maxHp * 100) + "%";
        document.getElementById('cpu-hp').style.width = (cState.hp / cState.maxHp * 100) + "%";
        document.getElementById('player-hp-text').textContent = pState.hp + " / " + pState.maxHp + " PV";
        document.getElementById('cpu-hp-text').textContent = cState.hp + " / " + cState.maxHp + " PV";
    }

    async function turn(mId) {
        document.querySelectorAll('.atk-btn').forEach(b => b.disabled = true);
        
        // Joueur
        const m = movesDB[mId];
        const res = calculateDamage(m, pState, cState);
        cState.hp = Math.max(0, cState.hp - res.total);
        addLog("Tu lances " + m.nom + " !");
        if(res.multi > 1) addLog("C'est super efficace !", "#ffcc00");
        if(res.multi < 1 && res.multi > 0) addLog("Ce n'est pas très efficace...", "#888");
        updateUI();

        if(cState.hp <= 0) return addLog("VICTOIRE !", "#00ff00");

        // Ordinateur
        await new Promise(r => setTimeout(r, 1000));
        const cm = movesDB["A02"];
        const cres = calculateDamage(cm, cState, pState);
        pState.hp = Math.max(0, pState.hp - cres.total);
        addLog("L'ordinateur utilise " + cm.nom + " !", "#ff4444");
        updateUI();

        if(pState.hp <= 0) return addLog("DÉFAITE...", "#ff0000");
        document.querySelectorAll('.atk-btn').forEach(b => b.disabled = false);
    }

    function init() {
        const cont = document.getElementById('move-container');
        pState.moves.forEach(id => {
            const b = document.createElement('button');
            b.className = 'atk-btn';
            b.innerHTML = movesDB[id].nom + " <span class='type-badge'>" + movesDB[id].type + "</span>";
            b.onclick = () => turn(id);
            cont.appendChild(b);
        });
        updateUI();
        addLog("Arène prête. En attente de vos ordres.");
    }
    init();
</script>
</body>
</html>


<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Combat Final - Gacha</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0b0b18; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        #arena { width: 850px; height: 500px; background: #16213e; border: 5px solid #533483; position: relative; border-radius: 20px; overflow: hidden; }
        
        .fighter { width: 220px; position: absolute; text-align: center; transition: all 0.5s ease; }
        #p-pos { bottom: 30px; left: 50px; }
        #c-pos { top: 30px; right: 50px; }
        
        .hp-box { background: rgba(0,0,0,0.8); padding: 8px; border-radius: 8px; border: 2px solid #533483; }
        .hp-bar { width: 100%; height: 10px; background: #444; border-radius: 5px; margin-top: 5px; }
        .hp-fill { height: 100%; background: #00ff88; width: 100%; transition: width 0.4s; }
        
        .char-img { width: 180px; height: 180px; object-fit: contain; filter: drop-shadow(0 0 10px rgba(255,255,255,0.2)); }
        
        #log { width: 850px; height: 100px; background: #000; border: 2px solid #533483; margin-top: 10px; padding: 10px; overflow-y: auto; font-family: monospace; color: #00ffcc; }
        
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 850px; margin-top: 10px; }
        .atk-btn { padding: 15px; background: #1a1a2e; border: 2px solid #e94560; color: white; border-radius: 8px; cursor: pointer; }
        .atk-btn:hover:not(:disabled) { background: #e94560; }
        
        .team-status { position: absolute; bottom: 10px; right: 10px; font-size: 0.8em; opacity: 0.7; }
    </style>
</head>
<body>
    <div id="arena">
        <!-- BOT -->
        <div id="c-pos" class="fighter">
            <div class="hp-box">
                <strong id="c-name">BOT</strong>
                <div class="hp-bar"><div id="c-hp-fill" class="hp-fill"></div></div>
                <small id="c-hp-txt">??/??</small>
            </div>
            <img id="c-img" class="char-img" src="">
        </div>

        <!-- JOUEUR -->
        <div id="p-pos" class="fighter">
            <img id="p-img" class="char-img" src="">
            <div class="hp-box">
                <strong id="p-name">CHARGEMENT...</strong>
                <div class="hp-bar"><div id="p-hp-fill" class="hp-fill"></div></div>
                <small id="p-hp-txt">??/??</small>
            </div>
        </div>
        
        <div class="team-status">Équipe : <span id="p-team-idx">1</span>/6 | Bot : <span id="c-team-idx">1</span>/6</div>
    </div>

    <div id="log">> Initialisation du combat...</div>
    <div id="controls" class="controls"></div>

<script>
    const typeTable = {"Poing": {"glace": 2, "roche": 0.5}, "Tranche": {"Poing": 2, "Feu": 0.5, "plante": 2, "roche": 0.5, "electrique": 0.5}, "Feu": {"Tranche": 2, "Feu": 0.5, "glace": 2, "plante": 2, "Eau": 0.5, "roche": 0.5, "Poison": 0.5}, "glace": {"Feu": 0.5, "glace": 0.5, "Eau": 2, "roche": 2, "electrique": 2, "Poison": 0.5}, "plante": {"Feu": 0.5, "glace": 0.5, "plante": 2, "Eau": 0.5, "roche": 2, "electrique": 2, "Poison": 2}, "Eau": {"glace": 2, "plante": 0.5, "Eau": 0.5, "roche": 0.5, "Poison": 2}, "roche": {"Poing": 2, "Tranche": 2, "glace": 2, "plante": 0.5, "Eau": 0.5, "roche": 0.5, "electrique": 0.5}, "electrique": {"plante": 0.5, "Eau": 2, "roche": 0.5, "electrique": 0.5, "t\u00e9n\u00e8bre": 2, "Poison": 2}, "t\u00e9n\u00e8bre": {"Poing": 2, "glace": 0.5, "electrique": 0.5, "t\u00e9n\u00e8bre": 2, "Poison": 2}, "Poison": {"Feu": 2, "glace": 0.5, "plante": 0.5, "t\u00e9n\u00e8bre": 2, "Poison": 0.5}};
    let movesDB = {};
    
    // Équipes
    let playerTeam = JSON.parse(localStorage.getItem('playerTeam')) || [];
    let botTeam = [];
    
    let pIdx = 0;
    let cIdx = 0;

    async function initCombat() {
        try {
            addLog("Chargement des données...");

            const [movesRes, battleRes, shopRes] = await Promise.all([
                fetch('attaques_reference.json'),
                fetch('cards_battle_data.json'),
                fetch('shop.json')
            ]);

            if (!movesRes.ok || !battleRes.ok || !shopRes.ok) {
                throw new Error(`Fichier(s) introuvable(s). Vérifiez les noms sur GitHub.`);
            }

            movesDB = await movesRes.json();
            const battleData = await battleRes.json();
            const shopData = await shopRes.json();

            // --- LOGIQUE POUR LE JOUEUR ---
            // On parcourt l'équipe du joueur et on ajoute l'image du shop pour chaque perso
            playerTeam = playerTeam.map(p => {
                const info = shopData[p.id] || {};
                return {
                    ...p,
                    img: info.img || "Carte/default.png", // Cherche l'image dans shop.json
                    nom: info.nom || p.nom,
                    status: null 
                };
            });

            // --- LOGIQUE POUR LE BOT ---
            const botStats = battleData["001"];
            const botInfo = shopData["001"] || { nom: "Acolyte Shinseina", img: "Carte/Shinseina1.png" };

            botTeam = [];
            for(let i=0; i<6; i++) {
                botTeam.push({
                    id: "001",
                    nom: botInfo.nom,
                    img: botInfo.img,
                    status: null, 
                    ...JSON.parse(JSON.stringify(botStats))
                });
            }

            if(!playerTeam || playerTeam.length === 0) {
                addLog("Erreur: Aucune équipe choisie !", "#ff4444");
                return;
            }

            addLog("Combat prêt !");
            startTurn();
        } catch(e) {
            console.error(e);
            addLog("ERREUR : " + e.message, "#ff4444");
        }
    }

    function addLog(msg, col="#00ffcc") {
        const l = document.getElementById('log');
        l.innerHTML += `<div style="color:${col}">> ${msg}</div>`;
        l.scrollBy(0, 100);
    }

    function updateUI() {
        const p = playerTeam[pIdx];
        const c = botTeam[cIdx];

        // Player
        document.getElementById('p-name').textContent = p.nom + (p.status ? ` [${p.status}]` : "");
        document.getElementById('p-img').src = p.img;
        document.getElementById('p-hp-fill').style.width = (p.stats.hp / p.maxHp * 100) + "%";
        document.getElementById('p-hp-txt').textContent = p.stats.hp + "/" + p.maxHp;

        // Bot
        document.getElementById('c-name').textContent = c.nom + (c.status ? ` [${c.status}]` : "");
        document.getElementById('c-img').src = c.img;
        document.getElementById('c-hp-fill').style.width = (c.stats.hp / c.maxHp * 100) + "%";
        document.getElementById('c-hp-txt').textContent = c.stats.hp + "/" + c.maxHp;
        
        document.getElementById('p-team-idx').textContent = pIdx + 1;
        document.getElementById('c-team-idx').textContent = cIdx + 1;
    }

    function startTurn() {
        // On initialise les PV Max au premier tour de chaque perso
        if(!playerTeam[pIdx].maxHp) playerTeam[pIdx].maxHp = playerTeam[pIdx].stats.hp;
        if(!botTeam[cIdx].maxHp) botTeam[cIdx].maxHp = botTeam[cIdx].stats.hp;

        updateUI();
        const cont = document.getElementById('controls');
        cont.innerHTML = "";

        playerTeam[pIdx].moves.forEach(mId => {
            const move = movesDB[mId] || { nom: "Attaque", puissance: 40, type: "Tranche", cat: "Physique" };
            const btn = document.createElement('button');
            btn.className = 'atk-btn';
            btn.innerHTML = `${move.nom} <br><small>${move.type} (${move.puissance})</small>`;
            btn.onclick = () => play(mId);
            cont.appendChild(btn);
        });
    }

    async function play(mId) {
        document.querySelectorAll('.atk-btn').forEach(b => b.disabled = true);
        
        const p = playerTeam[pIdx];
        const c = botTeam[cIdx];
        const playerMove = movesDB[mId] || { nom: "Attaque", puissance: 40, type: "Tranche", cat: "Physique" };
        const botMoveId = c.moves[0];
        const botMove = movesDB[botMoveId] || { nom: "Charge", puissance: 40, type: "Poing", cat: "Physique" };

        // Déterminer qui attaque en premier
        // Si le Bot a l'attaque 002 et pas le joueur, le Bot commence
        let botGoesFirst = (botMoveId === "002" && mId !== "002");

        if (botGoesFirst) {
            // --- LE BOT ATTAQUE EN PREMIER ---
            await botTurn(c, p, botMove);
            if (p.stats.hp > 0) await playerTurn(p, c, playerMove);
        } else {
            // --- LE JOUEUR ATTAQUE EN PREMIER (Cas normal ou priorité joueur) ---
            await playerTurn(p, c, playerMove);
            if (c.stats.hp > 0) await botTurn(c, p, botMove);
        }

        // Fin de tour : Dégâts de statut et remise à zéro des boutons
        if (p.stats.hp > 0 && c.stats.hp > 0) {
            document.querySelectorAll('.atk-btn').forEach(b => b.disabled = false);
        }
    }

    // Sous-fonction pour l'action du Joueur
    async function playerTurn(p, c, move) {
        if (p.status !== "Gel") {
            // --- EFFET SPÉCIAL ATTAQUE 003 ---
            if (move.id === "003") {
                p.stats.atk += 20; // Augmente l'attaque de 20
                addLog(`${p.nom} augmente sa puissance !`, "#ffff00"); // Message spécial
            } else {
                // Attaque normale
                const dmg = calc(move, p, c);
                c.stats.hp = Math.max(0, c.stats.hp - dmg.total);
                addLog(`${p.nom} utilise ${move.nom} !`);[cite, 2]
                if(dmg.multi > 1) addLog("C'est super efficace !", "#ffcc00");[cite, 2]
            }
        } else {
            addLog(`${p.nom} est gelé !`, "#00ccff");[cite, 2]
        }
        handleStatusEndOfTurn(p);[cite, 2]
        updateUI();[cite, 2]
        if(c.stats.hp <= 0) await handleKO(c, "c");[cite, 2]
    }

    // Sous-fonction pour l'action du Bot
    async function botTurn(c, p, move) {
        await new Promise(r => setTimeout(r, 800));[cite, 2]
        if (c.status !== "Gel") {
            // --- EFFET SPÉCIAL ATTAQUE 003 ---
            if (move.id === "003") {
                c.stats.atk += 20; // Augmente l'attaque du bot de 20
                addLog(`${c.nom} augmente sa puissance !`, "#ffff00");[cite, 2]
            } else {
                // Attaque normale
                const dmg = calc(move, c, p);
                p.stats.hp = Math.max(0, p.stats.hp - dmg.total);
                addLog(`${c.nom} réplique avec ${move.nom} !`, "#ff4444");[cite, 2]
            }
        } else {
            addLog(`${c.nom} est gelé !`, "#00ccff");[cite, 2]
        }
        handleStatusEndOfTurn(c);[cite, 2]
        updateUI();[cite, 2]
        if(p.stats.hp <= 0) await handleKO(p, "p");[cite, 2]
    }

    // Fonction pour gérer le KO proprement
    async function handleKO(char, type) {
        addLog(`${char.nom} est K.O. !`, "#ff4444");
        if (type === "c") {
            cIdx++;
            if(cIdx >= 6) return addLog("VICTOIRE TOTALE !", "#00ff00");
        } else {
            pIdx++;
            if(pIdx >= 6) return addLog("DÉFAITE...", "#ff0000");
        }
        await new Promise(r => setTimeout(r, 1000));
        startTurn();
    }

    function calc(m, a, d) {
        const atkS = m.cat === "Physique" ? a.stats.atk : a.stats.spa;
        const defS = m.cat === "Physique" ? d.stats.def : d.stats.spd;
        let base = Math.floor(((m.puissance * atkS) / defS) / 2);
        let mult = 1.0;
        d.types.forEach(t => { if(typeTable[m.type] && typeTable[m.type][t]) mult *= typeTable[m.type][t]; });
        return { total: Math.max(1, Math.floor(base * mult)), multi: mult };
    }

    function handleStatusEndOfTurn(char) {
        if (!char.status) return;

        // 1. Dégâts de Brulure[cite: 2]
        if (char.status === "Brulure") {
            char.stats.hp = Math.max(0, char.stats.hp - 10);
            addLog(`${char.nom} brûle (-10 PV)`, "#ff6600");
        }

        // 2. Chances de partir (Random)[cite: 2]
        const r = Math.random() * 100;
        if (char.status === "Brulure" && r < 40) char.status = null;
        if (char.status === "Gel" && r < 60) char.status = null;
        if (char.status === "Paralysie" && r < 20) char.status = null;
        
        if (!char.status) addLog(`${char.nom} est guéri !`, "#00ff00");
    }

    initCombat();
</script>
</body>
</html>

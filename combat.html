<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>GachaHB Combat Stable</title>
    <style>
        body { background: #1a1b1e; color: white; font-family: sans-serif; text-align: center; margin: 0; overflow: hidden; }
        #arena { 
            width: 1200px; height: 700px; background: #2f3136; margin: 15px auto; 
            position: relative; border: 5px solid #444; border-radius: 12px; overflow: hidden;
        }
        .unit { 
            width: 65px; height: 65px; position: absolute; background-size: cover; background-position: center;
            border-radius: 10px; z-index: 2; border: 3px solid white;
        }
        .team-player { border-color: #5865f2; }
        .team-enemy { border-color: #f04747; }
        .hp-container { position: absolute; top: -15px; width: 100%; height: 6px; background: #000; }
        .hp-bar { height: 100%; background: #43b581; width: 100%; }
        .bullet { position: absolute; width: 10px; height: 10px; background: yellow; border-radius: 50%; z-index: 10; }
        .explosion { position: absolute; background: radial-gradient(circle, orange, transparent); border-radius: 50%; animation: b 0.5s forwards; }
        @keyframes b { from { transform: scale(0); opacity: 1; } to { transform: scale(3); opacity: 0; } }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

    <button onclick="initBattle()">LANCER LE COMBAT</button>
    <div id="arena"></div>

    <script>
        let units = [];
        let battleActive = false;
        let loop;
        const UNIT_SIZE = 65;

        function getDist(a, b) { return Math.sqrt((a.x - b.x)**2 + (a.y - b.y)**2); }
        function getTier(p) { return (!p || p === "none") ? 0 : parseInt(p.split('_').pop()); }

        async function initBattle() {
            const arena = document.getElementById('arena');
            arena.innerHTML = ""; units = []; battleActive = false;
            clearInterval(loop);

            const cb = "?t=" + Date.now();
            const [rShop, rStats, rArmies] = await Promise.all([fetch('shop.json'+cb), fetch('stats.json'+cb), fetch('armies.json'+cb)]);
            const shop = await rShop.json(), stats = await rStats.json(), armies = await rArmies.json();

            const myArmy = JSON.parse(localStorage.getItem('myGachaArmy')) || [];
            const enemy = armies[Object.keys(armies)[0]]; // Prend la première armée ennemie par défaut

            // Spawn Joueur
            myArmy.forEach((id, i) => {
                spawnUnit(id, shop[id], stats[id], 100 + (i*20), 100 + (i*80), 'team-player');
            });

            // Spawn Ennemi
            enemy.units.forEach((id, i) => {
                spawnUnit(id, shop[id], stats[id], 1000 - (i*20), 100 + (i*80), 'team-enemy');
            });

            battleActive = true;
            loop = setInterval(update, 30);
        }

        function spawnUnit(id, baseData, statData, x, y, team, isClone = false) {
            if(!baseData) return;
            const s = statData || {hp:100, atk:10, rng:2, spd:2, as:1000, power:"none"};
            
            const u = {
                id, team, x, y, 
                hp: isClone ? s.hp/2 : s.hp, maxHp: isClone ? s.hp/2 : s.hp,
                atk: s.atk, baseAtk: s.atk, range: s.rng * 80, as: s.as, spd: s.spd,
                power: isClone ? "none" : s.power, 
                vx: (Math.random()-0.5)*2, vy: (Math.random()-0.5)*2,
                lastAtk: 0, lastSpecial: Date.now(), el: null, hpBar: null
            };

            const el = document.createElement('div');
            el.className = `unit ${team}`;
            el.style.backgroundImage = `url('Carte/${id}.png')`;
            el.style.left = u.x + "px";
            el.style.top = u.y + "px";
            if(isClone) el.style.opacity = "0.5";
            
            el.innerHTML = `<div class="hp-container"><div class="hp-bar"></div></div>`;
            document.getElementById('arena').appendChild(el);
            
            u.el = el;
            u.hpBar = el.querySelector('.hp-bar');
            units.push(u);
        }

        function update() {
            if(!battleActive) return;

            units.forEach(u => {
                if(u.hp <= 0) return;

                const tier = getTier(u.power);

                // Spécial Clone
                if(u.power.startsWith("clone") && Date.now() - u.lastSpecial > (10000 - tier*2000)) {
                    spawnUnit(u.id, {nom:"Clone"}, {hp:20, atk:u.atk, rng:u.range/80, spd:u.spd, as:u.as}, u.x, u.y, u.team, true);
                    u.lastSpecial = Date.now();
                }

                // Ciblage
                let enemies = units.filter(e => e.team !== u.team && e.hp > 0);
                let target = enemies.sort((a,b) => getDist(u,a) - getDist(u,b))[0];

                if(target && getDist(u, target) <= u.range) {
                    u.vx *= 0.8; u.vy *= 0.8;
                    if(Date.now() - u.lastAtk > u.as) {
                        attack(u, target);
                        u.lastAtk = Date.now();
                    }
                } else {
                    u.vx += (Math.random()-0.5)*0.2;
                    u.vy += (Math.random()-0.5)*0.2;
                }

                // Mouvement et limites
                u.x += u.vx; u.y += u.vy;
                if(u.x < 0 || u.x > 1135) u.vx *= -1;
                if(u.y < 0 || u.y > 635) u.vy *= -1;

                // Collision unités
                units.forEach(o => {
                    if(o === u || o.hp <= 0) return;
                    if(getDist(u, o) < 50) {
                        u.vx -= (o.x - u.x) * 0.05;
                        u.vy -= (o.y - u.y) * 0.05;
                    }
                });

                u.el.style.left = u.x + "px";
                u.el.style.top = u.y + "px";
            });
            
            if(units.filter(u=>u.team==='team-player' && u.hp > 0).length === 0) end("DÉFAITE");
            if(units.filter(u=>u.team==='team-enemy' && u.hp > 0).length === 0) end("VICTOIRE");
        }

        function attack(u, t) {
            const b = document.createElement('div');
            b.className = "bullet";
            b.style.left = (u.x+25) + "px"; b.style.top = (u.y+25) + "px";
            document.getElementById('arena').appendChild(b);

            setTimeout(() => {
                b.style.left = (t.x+25) + "px"; b.style.top = (t.y+25) + "px";
                b.style.transition = "0.2s linear";
            }, 20);

            setTimeout(() => {
                b.remove();
                if(t.hp <= 0) return;
                
                let dmg = u.atk;
                if(t.power.startsWith("tank")) dmg *= (1 - getTier(t.power)*0.2);
                
                t.hp -= dmg;
                t.hpBar.style.width = (t.hp / t.maxHp * 100) + "%";

                if(t.hp <= 0) {
                    t.el.style.display = "none";
                    if(t.power.startsWith("last_blast")) explode(t);
                }
            }, 220);
        }

        function explode(u) {
            const tier = getTier(u.power);
            const e = document.createElement('div');
            e.className = "explosion";
            e.style.width = e.style.height = (tier*100) + "px";
            e.style.left = (u.x - 20) + "px"; e.style.top = (u.y - 20) + "px";
            document.getElementById('arena').appendChild(e);
            
            units.forEach(o => {
                if(o.team !== u.team && o.hp > 0 && getDist(u, o) < tier*100) {
                    o.hp -= 30;
                    o.hpBar.style.width = (o.hp / o.maxHp * 100) + "%";
                    if(o.hp <= 0) o.el.style.display = "none";
                }
            });
            setTimeout(() => e.remove(), 500);
        }

        function end(msg) { battleActive = false; alert(msg); location.reload(); }
    </script>
</body>
</html>

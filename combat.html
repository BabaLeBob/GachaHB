<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>GachaHB - Ultimate Chaos Arena</title>
    <style>
        :root { --bg: #1a1b1e; --arena: #2f3136; --p-color: #5865f2; --e-color: #f04747; }
        body { background: var(--bg); color: white; font-family: sans-serif; text-align: center; margin: 0; overflow: hidden; }
        
        #arena { 
            width: 1100px; height: 650px; background: var(--arena); margin: 15px auto; 
            position: relative; border: 5px solid #444; border-radius: 15px; overflow: hidden;
            background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 30px 30px;
        }

        .unit { 
            width: 60px; height: 60px; position: absolute; background-size: cover; 
            background-position: center; border-radius: 12px; border: 3px solid white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5); z-index: 2; transition: filter 0.3s;
        }
        .team-player { border-color: var(--p-color); }
        .team-enemy { border-color: var(--e-color); }

        /* EFFETS VISUELS */
        .hp-container { position: absolute; top: -15px; width: 100%; height: 6px; background: #000; border-radius: 3px; }
        .hp-bar { height: 100%; background: #43b581; width: 100%; border-radius: 3px; transition: width 0.3s; }
        
        .shield-fx { position: absolute; width: 80px; height: 80px; border: 2px solid rgba(0, 191, 255, 0.6); border-radius: 50%; top: -13px; left: -13px; pointer-events: none; background: rgba(0, 191, 255, 0.1); display: none; animation: pulse 2s infinite; }
        .berserk-fx { position: absolute; width: 100%; height: 100%; border-radius: 10px; box-shadow: 0 0 20px #ff0000; background: rgba(255, 0, 0, 0.2); display: none; }
        .paralyzed { filter: brightness(0.5) sepia(1) hue-rotate(240deg) !important; }
        
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.4; } 50% { transform: scale(1.1); opacity: 0.7; } }
        
        .bullet { position: absolute; width: 10px; height: 10px; background: #fff176; border-radius: 50%; box-shadow: 0 0 10px orange; z-index: 5; }
        .explosion { position: absolute; background: radial-gradient(circle, #ff5f00, transparent); border-radius: 50%; animation: blast 0.5s forwards; z-index: 1; }
        @keyframes blast { from { transform: scale(0); opacity: 1; } to { transform: scale(3.5); opacity: 0; } }

        .effect-text { position: absolute; font-weight: bold; font-size: 22px; pointer-events: none; z-index: 10; animation: floatUp 0.8s forwards; }
        @keyframes floatUp { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-40px); opacity: 0; } }

        button { padding: 12px 25px; font-size: 18px; cursor: pointer; background: var(--p-color); color: white; border: none; border-radius: 5px; margin-top: 10px; }
    </style>
</head>
<body>

    <button onclick="initBattle()">LANCER LE COMBAT SUPRÊME</button>
    <div id="arena"></div>

    <script>
        let units = [];
        let battleActive = false;
        const UNIT_SIZE = 60;
        const ARENA_W = 1100, ARENA_H = 650;

        function getTier(p) { return (!p || p === "none") ? 0 : parseInt(p.split('_').pop()) || 1; }
        function getDist(a, b) { return Math.sqrt((a.x-b.x)**2 + (a.y-b.y)**2); }

        async function initBattle() {
            const arena = document.getElementById('arena');
            arena.innerHTML = ""; units = []; battleActive = false;
            const cb = "?t=" + Date.now();
            const [rS, rSt, rA] = await Promise.all([fetch('shop.json'+cb), fetch('stats.json'+cb), fetch('armies.json'+cb)]);
            const shop = await rS.json(), stats = await rSt.json(), armies = await rA.json();
            
            const myArmyIds = JSON.parse(localStorage.getItem('myGachaArmy')) || [];
            const enemyArmy = armies[Object.keys(armies)[0]].units;

            myArmyIds.forEach((id, i) => spawn(id, shop[id], stats[id], 100, 100 + (i*90), 'team-player'));
            enemyArmy.forEach((id, i) => spawn(id, shop[id], stats[id], 900, 100 + (i*90), 'team-enemy'));

            battleActive = true;
            requestAnimationFrame(update);
        }

        function spawn(id, base, stat, x, y, team) {
            if(!base || !stat) return;
            const u = {
                id, team, x, y, hp: stat.hp, maxHp: stat.hp, atk: stat.atk, baseAtk: stat.atk,
                range: stat.rng * 80, as: stat.as, spd: stat.spd, power: stat.power,
                vx: (team === 'team-player' ? 1 : -1) * stat.spd, vy: (Math.random()-0.5) * stat.spd,
                lastAtk: 0, lastTick: Date.now(), poisonTicks: 0, burnTicks: 0, isParalyzed: false,
                el: null, hpBar: null
            };

            const el = document.createElement('div');
            el.className = `unit ${team}`;
            let img = base.img.includes('/') ? base.img : 'Carte/' + base.img;
            el.style.backgroundImage = `url('${img}')`;
            el.innerHTML = `
                <div class="hp-container"><div class="hp-bar"></div></div>
                <div class="shield-fx"></div>
                <div class="berserk-fx"></div>
            `;
            document.getElementById('arena').appendChild(el);
            
            u.el = el;
            u.hpBar = el.querySelector('.hp-bar');
            u.shieldEl = el.querySelector('.shield-fx');
            u.berserkEl = el.querySelector('.berserk-fx');
            if(u.power.startsWith("tank")) u.shieldEl.style.display = "block";
            
            units.push(u);
        }

        function update() {
            if(!battleActive) return;

            units.forEach(u => {
                if(u.hp <= 0) return;

                // 1. DÉPLACEMENT & MURS (Physique corrigée)
                if(!u.isParalyzed) {
                    u.x += u.vx; u.y += u.vy;
                    if(u.x <= 0) { u.x = 2; u.vx = u.spd; }
                    else if(u.x >= ARENA_W - UNIT_SIZE) { u.x = ARENA_W - UNIT_SIZE - 2; u.vx = -u.spd; }
                    if(u.y <= 0) { u.y = 2; u.vy = u.spd; }
                    else if(u.y >= ARENA_H - UNIT_SIZE) { u.y = ARENA_H - UNIT_SIZE - 2; u.vy = -u.spd; }
                }

                // 2. POUVOIR : AURA DE STASE (Immobilisation)
                u.isParalyzed = false; // Reset avant scan
                units.forEach(auraOwner => {
                    if(auraOwner.hp > 0 && auraOwner.team !== u.team && auraOwner.power.startsWith("aura_stop") && auraOwner.hp < auraOwner.maxHp * 0.5) {
                        if(getDist(u, auraOwner) < 160) {
                            u.isParalyzed = true;
                            u.vx = 0; u.vy = 0;
                        }
                    }
                });
                u.isParalyzed ? u.el.classList.add('paralyzed') : u.el.classList.remove('paralyzed');

                // 3. TICKS DE DÉGÂTS (Poison / Brûlure)
                if(Date.now() - u.lastTick > 1000) {
                    if(u.poisonTicks > 0) { u.hp -= 5; u.poisonTicks--; showFx(u, "🤢", "#4ecb71"); }
                    if(u.burnTicks > 0) { u.hp -= 8; u.burnTicks--; showFx(u, "🔥", "#ff5f00"); }
                    u.lastTick = Date.now();
                }

                // 4. POUVOIR : BERSERK
                if(u.power.startsWith("berserk")) {
                    if(u.hp < u.maxHp * 0.4) {
                        u.atk = u.baseAtk * (1 + getTier(u.power)*0.33);
                        u.berserkEl.style.display = "block";
                    } else { u.atk = u.baseAtk; u.berserkEl.style.display = "none"; }
                }

                // 5. COLLISIONS (Billard + Contagion)
                units.forEach(o => {
                    if(o === u || o.hp <= 0) return;
                    let dx = o.x - u.x, dy = o.y - u.y, dist = getDist(u, o);
                    if(dist < UNIT_SIZE - 5) {
                        let angle = Math.atan2(dy, dx);
                        u.vx = -Math.cos(angle) * u.spd; u.vy = -Math.sin(angle) * u.spd;
                        o.vx = Math.cos(angle) * o.spd; o.vy = Math.sin(angle) * o.spd;
                        // Contagion Brûlure
                        if(u.burnTicks > 0 && o.team === u.team) o.burnTicks = u.burnTicks;
                        if(o.burnTicks > 0 && u.team === o.team) u.burnTicks = o.burnTicks;
                    }
                });

                // 6. COMBAT IA
                let enemies = units.filter(e => e.team !== u.team && e.hp > 0);
                let target = enemies.sort((a,b) => getDist(u,a) - getDist(u,b))[0];
                if(target && getDist(u, target) <= u.range && !u.isParalyzed) {
                    if(Date.now() - u.lastAtk > u.as) { shoot(u, target); u.lastAtk = Date.now(); }
                }

                u.el.style.left = u.x + "px"; u.el.style.top = u.y + "px";
                u.hpBar.style.width = (Math.max(0, u.hp/u.maxHp*100)) + "%";
                if(u.hp <= 0) die(u);
            });

            checkGameOver();
            if(battleActive) requestAnimationFrame(update);
        }

        function shoot(u, t) {
            const b = document.createElement('div');
            b.className = "bullet";
            b.style.left = (u.x+25)+"px"; b.style.top = (u.y+25)+"px";
            document.getElementById('arena').appendChild(b);
            
            let start = Date.now(), dur = 250, sX = u.x+25, sY = u.y+25;
            function anim() {
                let p = (Date.now() - start) / dur;
                if(p >= 1) { b.remove(); hit(u, t); }
                else {
                    b.style.left = (sX + (t.x+25 - sX) * p) + "px";
                    b.style.top = (sY + (t.y+25 - sY) * p) + "px";
                    requestAnimationFrame(anim);
                }
            }
            requestAnimationFrame(anim);
        }

        function hit(u, t) {
            if(t.hp <= 0) return;
            let d = u.atk;
            const uT = getTier(u.power), tT = getTier(t.power);

            // Perçant vs Tank
            if(u.power.startsWith("piercing")) {
                if(t.power.startsWith("tank")) d *= (1 + uT * 0.2);
            } else if(t.power.startsWith("tank")) d *= (1 - tT * 0.2);

            // Sniper
            if(u.power.startsWith("sniper") && getDist(u, t) > 250) d *= (1 + uT*0.5);

            // Application Poison/Brûlure
            if(u.power.startsWith("poison")) t.poisonTicks = 10;
            if(u.power.startsWith("burn")) t.burnTicks = 10;

            t.hp -= d;

            // Vampire
            if(u.power.startsWith("vampire")) {
                let heal = d * (uT*0.15);
                u.hp = Math.min(u.maxHp, u.hp + heal);
                showFx(u, "+"+Math.round(heal), "#43b581");
            }
        }

        function die(u) {
            if(u.el.style.display === "none") return;
            u.el.style.display = "none";
            if(u.power.startsWith("last_blast")) {
                const tier = getTier(u.power);
                const ex = document.createElement('div');
                ex.className = "explosion";
                ex.style.width = ex.style.height = (tier*120)+"px";
                ex.style.left = (u.x - tier*30)+"px"; ex.style.top = (u.y - tier*30)+"px";
                document.getElementById('arena').appendChild(ex);
                units.forEach(o => { if(o.team !== u.team && o.hp > 0 && getDist(u, o) < tier*100) o.hp -= 40 * tier; });
                setTimeout(() => ex.remove(), 500);
            }
        }

        function showFx(u, txt, color) {
            const f = document.createElement('div');
            f.className = "effect-text"; f.style.color = color;
            f.innerText = txt; f.style.left = u.x + "px"; f.style.top = u.y + "px";
            document.getElementById('arena').appendChild(f);
            setTimeout(() => f.remove(), 800);
        }

        function checkGameOver() {
            const p = units.filter(u=>u.team==='team-player' && u.hp>0).length;
            const e = units.filter(u=>u.team==='team-enemy' && u.hp>0).length;
            if(battleActive && (p === 0 || e === 0)) {
                battleActive = false;
                alert(p === 0 ? "DÉFAITE..." : "VICTOIRE !");
                location.reload();
            }
        }
    </script>
</body>
</html>

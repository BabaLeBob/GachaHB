<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Admin - Physique & Tiers</title>
    <style>
        :root { --bg: #1a1b1e; --card-bg: #2f3136; --accent: #43b581; --text: #ffffff; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; padding: 20px; }
        .card-row { background: var(--card-bg); margin-bottom: 8px; padding: 10px; border-radius: 8px; display: grid; grid-template-columns: 150px repeat(6, 1fr); gap: 10px; align-items: center; }
        input, select { background: #111; border: 1px solid #444; color: white; padding: 5px; border-radius: 4px; width: 90%; }
        #output { width: 100%; height: 120px; background: #000; color: #0f0; margin-top: 15px; font-family: monospace; }
        button { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <h1>⚙️ CONFIGURATION DES TIERS</h1>
    <div id="editor-list">Chargement...</div>
    <button onclick="generateJSON()">🚀 GÉNÉRER STATS.JSON</button>
    <textarea id="output" readonly></textarea>

    <script>
        const powerList = [
            {id:"none", n:"Aucun", d:"Pas de pouvoir."},
            {id:"berserk_1", n:"Berserk T1", d:"+30% ATK si PV < 40%"}, {id:"berserk_2", n:"Berserk T2", d:"+60% ATK si PV < 40%"}, {id:"berserk_3", n:"Berserk T3", d:"+100% ATK si PV < 40%"},
            {id:"tank_1", n:"Tank T1", d:"-20% dégâts reçus"}, {id:"tank_2", n:"Tank T2", d:"-40% dégâts reçus"}, {id:"tank_3", n:"Tank T3", d:"-60% dégâts reçus"},
            {id:"vampire_1", n:"Vampire T1", d:"15% de vol de vie"}, {id:"vampire_2", n:"Vampire T2", d:"30% de vol de vie"}, {id:"vampire_3", n:"Vampire T3", d:"45% de vol de vie"},
            {id:"last_blast_1", n:"Explosion T1", d:"Petite explosion à la mort"}, {id:"last_blast_2", n:"Explosion T2", d:"Moyenne explosion à la mort"}, {id:"last_blast_3", n:"Explosion T3", d:"Grosse explosion à la mort"},
            {id:"sniper_1", n:"Sniper T1", d:"x1.5 dégâts de loin"}, {id:"sniper_2", n:"Sniper T2", d:"x2.0 dégâts de loin"}, {id:"sniper_3", n:"Sniper T3", d:"x2.5 dégâts de loin"}
        ];

        async function load() {
            const cb = "?t=" + Date.now();
            const rShop = await fetch('shop.json'+cb);
            const shop = await rShop.json();
            let html = "";
            for(let id in shop) {
                html += `<div class="card-row" data-id="${id}">
                    <div style="font-weight:bold">${shop[id].nom}</div>
                    <div><label>PV</label><input type="number" class="hp" value="100"></div>
                    <div><label>ATK</label><input type="number" class="atk" value="15"></div>
                    <div><label>RNG</label><input type="number" class="rng" value="2"></div>
                    <div><label>SPD</label><input type="number" class="spd" step="0.1" value="2.0"></div>
                    <div><label>AS (ms)</label><input type="number" class="as" value="1000"></div>
                    <div><label>POUVOIR</label><select class="power">
                        ${powerList.map(p => `<option value="${p.id}" title="${p.d}">${p.n}</option>`).join('')}
                    </select></div>
                </div>`;
            }
            document.getElementById('editor-list').innerHTML = html;
        }

        function generateJSON() {
            let res = {};
            document.querySelectorAll('.card-row').forEach(row => {
                res[row.dataset.id] = {
                    hp: parseInt(row.querySelector('.hp').value),
                    atk: parseInt(row.querySelector('.atk').value),
                    rng: parseInt(row.querySelector('.rng').value),
                    spd: parseFloat(row.querySelector('.spd').value),
                    as: parseInt(row.querySelector('.as').value),
                    power: row.querySelector('.power').value
                };
            });
            document.getElementById('output').value = JSON.stringify(res, null, 4);
        }
        load();
    </script>
</body>
</html>

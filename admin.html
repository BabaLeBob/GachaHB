<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Admin - Stats & Pouvoirs Tiers</title>
    <style>
        :root { --bg: #1a1b1e; --card-bg: #2f3136; --accent: #43b581; --text: #ffffff; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; padding: 20px; }
        .container { max-width: 1250px; margin: 0 auto; }
        .card-row { 
            background: var(--card-bg); margin-bottom: 10px; padding: 10px; border-radius: 8px; 
            display: grid; grid-template-columns: 60px 150px repeat(6, 1fr); align-items: center; gap: 10px;
        }
        .stat-group { display: flex; flex-direction: column; gap: 3px; }
        label { font-size: 9px; color: #b9bbbe; text-transform: uppercase; }
        input, select { background: #202225; border: 1px solid #111; color: white; padding: 5px; border-radius: 4px; }
        .actions { position: sticky; bottom: 0; background: var(--bg); padding: 20px; border-top: 2px solid #333; }
        #output { width: 100%; height: 150px; background: #000; color: #00ff00; font-family: monospace; margin-top: 10px; }
        button { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚙️ Configuration des Stats & Pouvoirs</h1>
        <div id="editor-list">Chargement...</div>
        <div class="actions">
            <button onclick="generateJSON()">🚀 GÉNÉRER STATS.JSON</button>
            <textarea id="output" readonly></textarea>
        </div>
    </div>

    <script>
        const powerList = [
            {id:"none", n:"Aucun"},
            {id:"berserk_1", n:"Berserk T1 (+30%)"}, {id:"berserk_2", n:"Berserk T2 (+60%)"}, {id:"berserk_3", n:"Berserk T3 (+100%)"},
            {id:"last_blast_1", n:"Explosion T1"}, {id:"last_blast_2", n:"Explosion T2"}, {id:"last_blast_3", n:"Explosion T3"},
            {id:"vampire_1", n:"Vampire T1"}, {id:"vampire_2", n:"Vampire T2"}, {id:"vampire_3", n:"Vampire T3"},
            {id:"aura_atk_1", n:"Aura ATK T1"}, {id:"aura_atk_2", n:"Aura ATK T2"}, {id:"aura_atk_3", n:"Aura ATK T3"},
            {id:"tank_1", n:"Tank T1 (-20%)"}, {id:"tank_2", n:"Tank T2 (-40%)"}, {id:"tank_3", n:"Tank T3 (-60%)"},
            {id:"sniper_1", n:"Sniper T1"}, {id:"sniper_2", n:"Sniper T2"}, {id:"sniper_3", n:"Sniper T3"},
            {id:"dodge_1", n:"Esquive T1 (15%)"}, {id:"dodge_2", n:"Esquive T2 (30%)"}, {id:"dodge_3", n:"Esquive T3 (45%)"},
            {id:"medic_1", n:"Soin T1"}, {id:"medic_2", n:"Soin T2"}, {id:"medic_3", n:"Soin T3"},
            {id:"poison_1", n:"Poison T1"}, {id:"poison_2", n:"Poison T2"}, {id:"poison_3", n:"Poison T3"},
            {id:"speed_boost_1", n:"Vitesse T1"}, {id:"speed_boost_2", n:"Vitesse T2"}, {id:"speed_boost_3", n:"Vitesse T3"}
        ];

        async function loadData() {
            const cb = "?t=" + Date.now();
            const [rShop, rStats] = await Promise.all([fetch('shop.json'+cb), fetch('stats.json'+cb).catch(()=>({json:()=>({})}))]);
            const shop = await rShop.json();
            const stats = await rStats.json();
            
            const list = document.getElementById('editor-list');
            list.innerHTML = "";
            for(let id in shop) {
                const s = stats[id] || {};
                let pOptions = powerList.map(p => `<option value="${p.id}" ${s.power===p.id?'selected':''}>${p.n}</option>`).join('');
                list.innerHTML += `
                    <div class="card-row" data-id="${id}">
                        <div style="font-size:10px">${id}</div>
                        <div style="font-weight:bold">${shop[id].nom}</div>
                        <div class="stat-group"><label>PV</label><input type="number" class="hp" value="${s.hp||100}"></div>
                        <div class="stat-group"><label>ATK</label><input type="number" class="atk" value="${s.atk||15}"></div>
                        <div class="stat-group"><label>RNG</label><input type="number" class="rng" value="${s.rng||2}"></div>
                        <div class="stat-group"><label>SPD</label><input type="number" class="spd" step="0.1" value="${s.spd||2.5}"></div>
                        <div class="stat-group"><label>AS (ms)</label><input type="number" class="as" value="${s.as||1000}"></div>
                        <div class="stat-group"><label>POUVOIR</label><select class="power">${pOptions}</select></div>
                    </div>`;
            }
        }

        function generateJSON() {
            let res = {};
            document.querySelectorAll('.card-row').forEach(row => {
                res[row.dataset.id] = {
                    hp: parseInt(row.querySelector('.hp').value),
                    atk: parseInt(row.querySelector('.atk').value),
                    rng: parseInt(row.querySelector('.rng').value),
                    spd: parseFloat(row.querySelector('.spd').value),
                    as: parseInt(row.querySelector('.as').value),
                    power: row.querySelector('.power').value
                };
            });
            document.getElementById('output').value = JSON.stringify(res, null, 4);
        }
        loadData();
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Admin - Stats des Cartes</title>
    <style>
        body { background: #1a1a1a; color: white; font-family: sans-serif; padding: 20px; }
        .card-row { background: #333; margin: 5px; padding: 10px; display: flex; align-items: center; gap: 10px; border-radius: 5px; }
        input { width: 60px; padding: 5px; }
        #output { width: 100%; height: 200px; margin-top: 20px; background: #000; color: #0f0; }
    </style>
</head>
<body>
    <h1>⚙️ Configuration des Stats</h1>
    <div id="editor"></div>
    <button onclick="generateJSON()" style="padding:15px; background:green; color:white; margin-top:20px;">GÉNÉRER LE FICHIER STATS.JSON</button>
    <textarea id="output" readonly placeholder="Le JSON apparaîtra ici. Copie-le dans ton fichier stats.json sur GitHub."></textarea>

    <script>
        let cardsBase = {};
        async function load() {
            const res = await fetch('shop.json');
            cardsBase = await res.json();
            const container = document.getElementById('editor');
            
            for(let id in cardsBase) {
                container.innerHTML += `
                    <div class="card-row" data-id="${id}">
                        <b>${id}</b> | <span>${cardsBase[id].nom}</span>
                        ATK: <input type="number" class="atk" value="10">
                        PV: <input type="number" class="hp" value="50">
                        PORTÉE: <input type="number" class="rng" value="1" min="1" max="5">
                    </div>`;
            }
        }
        function generateJSON() {
            let config = {};
            document.querySelectorAll('.card-row').forEach(row => {
                config[row.dataset.id] = {
                    atk: parseInt(row.querySelector('.atk').value),
                    hp: parseInt(row.querySelector('.hp').value),
                    rng: parseInt(row.querySelector('.rng').value)
                };
            });
            document.getElementById('output').value = JSON.stringify(config, null, 4);
        }
        load();
    </script>
</body>
</html>

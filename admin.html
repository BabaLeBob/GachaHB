<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Admin - Stable v3</title>
    <style>
        :root { --bg: #1a1b1e; --card-bg: #2f3136; --accent: #43b581; --text: #ffffff; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; padding: 20px; }
        .card-row { 
            background: var(--card-bg); margin-bottom: 8px; padding: 10px; border-radius: 8px; 
            display: grid; grid-template-columns: 150px repeat(6, 1fr); align-items: center; gap: 10px;
        }
        .stat-group { display: flex; flex-direction: column; }
        label { font-size: 10px; color: #aaa; font-weight: bold; }
        input, select { background: #111; border: 1px solid #444; color: white; padding: 5px; border-radius: 4px; }
        #output { width: 100%; height: 150px; background: #000; color: #0f0; margin-top: 15px; }
        button { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>⚙️ CONFIGURATION DES STATS</h1>
    <div id="editor-list">Chargement...</div>
    <button onclick="generateJSON()">🚀 GÉNÉRER STATS.JSON</button>
    <textarea id="output" readonly></textarea>

    <script>
        const powerList = [
            {id:"none", n:"Aucun"},
            {id:"berserk_1", n:"Berserk T1"}, {id:"berserk_2", n:"Berserk T2"}, {id:"berserk_3", n:"Berserk T3"},
            {id:"last_blast_1", n:"Explosion T1"}, {id:"last_blast_2", n:"Explosion T2"}, {id:"last_blast_3", n:"Explosion T3"},
            {id:"vampire_1", n:"Vampire T1"}, {id:"vampire_2", n:"Vampire T2"}, {id:"vampire_3", n:"Vampire T3"},
            {id:"aura_atk_1", n:"Aura ATK T1"}, {id:"aura_atk_2", n:"Aura ATK T2"}, {id:"aura_atk_3", n:"Aura ATK T3"},
            {id:"tank_1", n:"Tank T1"}, {id:"tank_2", n:"Tank T2"}, {id:"tank_3", n:"Tank T3"},
            {id:"sniper_1", n:"Sniper T1"}, {id:"sniper_2", n:"Sniper T2"}, {id:"sniper_3", n:"Sniper T3"},
            {id:"dodge_1", n:"Esquive T1"}, {id:"dodge_2", n:"Esquive T2"}, {id:"dodge_3", n:"Esquive T3"},
            {id:"clone_1", n:"Miroir T1"}, {id:"clone_2", n:"Miroir T2"}, {id:"clone_3", n:"Miroir T3"},
            {id:"chain_1", n:"Chaîne T1"}, {id:"chain_2", n:"Chaîne T2"}, {id:"chain_3", n:"Chaîne T3"}
        ];

        async function load() {
            const cb = "?t=" + Date.now();
            const [rS, rSt] = await Promise.all([fetch('shop.json'+cb), fetch('stats.json'+cb).catch(()=>({}))]);
            const shop = await rS.json();
            const stats = rSt.ok ? await rSt.json() : {};
            
            let html = "";
            for(let id in shop) {
                const s = stats[id] || {};
                const opts = powerList.map(p => `<option value="${p.id}" ${s.power===p.id?'selected':''}>${p.n}</option>`).join('');
                html += `<div class="card-row" data-id="${id}">
                    <div style="font-weight:bold">${shop[id].nom}</div>
                    <div class="stat-group"><label>PV</label><input type="number" class="hp" value="${s.hp||100}"></div>
                    <div class="stat-group"><label>ATK</label><input type="number" class="atk" value="${s.atk||15}"></div>
                    <div class="stat-group"><label>RNG</label><input type="number" class="rng" value="${s.rng||2}"></div>
                    <div class="stat-group"><label>SPD</label><input type="number" class="spd" step="0.1" value="${s.spd||2.5}"></div>
                    <div class="stat-group"><label>AS (ms)</label><input type="number" class="as" value="${s.as||1000}"></div>
                    <div class="stat-group"><label>POUVOIR</label><select class="power">${opts}</select></div>
                </div>`;
            }
            document.getElementById('editor-list').innerHTML = html;
        }

        function generateJSON() {
            let res = {};
            document.querySelectorAll('.card-row').forEach(row => {
                res[row.dataset.id] = {
                    hp: parseInt(row.querySelector('.hp').value),
                    atk: parseInt(row.querySelector('.atk').value),
                    rng: parseInt(row.querySelector('.rng').value),
                    spd: parseFloat(row.querySelector('.spd').value),
                    as: parseInt(row.querySelector('.as').value),
                    power: row.querySelector('.power').value
                };
            });
            document.getElementById('output').value = JSON.stringify(res, null, 4);
        }
        load();
    </script>
</body>
</html>

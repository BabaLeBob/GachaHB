<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Admin - Stats & Pouvoirs Originaux</title>
    <style>
        :root { --bg: #1a1b1e; --card-bg: #2f3136; --accent: #43b581; --text: #ffffff; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; padding: 20px; }
        .container { max-width: 1300px; margin: 0 auto; }
        .card-row { 
            background: var(--card-bg); margin-bottom: 10px; padding: 10px; border-radius: 8px; 
            display: grid; grid-template-columns: 60px 150px repeat(6, 1fr); align-items: center; gap: 10px;
        }
        .stat-group { display: flex; flex-direction: column; gap: 3px; }
        label { font-size: 9px; color: #b9bbbe; text-transform: uppercase; font-weight: bold; }
        input, select { background: #202225; border: 1px solid #111; color: white; padding: 5px; border-radius: 4px; }
        .actions { position: sticky; bottom: 0; background: var(--bg); padding: 20px; border-top: 2px solid #333; margin-top: 20px; }
        #output { width: 100%; height: 150px; background: #000; color: #00ff00; font-family: monospace; margin-top: 10px; padding: 10px; }
        button { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        select:hover { border-color: var(--accent); }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚙️ Panel Admin : Capacités Spéciales</h1>
        <div id="editor-list">Chargement des troupes...</div>
        <div class="actions">
            <button onclick="generateJSON()">🚀 GÉNÉRER STATS.JSON</button>
            <textarea id="output" readonly></textarea>
        </div>
    </div>

    <script>
        const powerList = [
            {id:"none", n:"Aucun", d:"Pas de capacité spéciale."},
            {id:"berserk_1", n:"Berserk T1", d:"Sous 40% PV : +30% ATK"},
            {id:"berserk_2", n:"Berserk T2", d:"Sous 40% PV : +60% ATK"},
            {id:"berserk_3", n:"Berserk T3", d:"Sous 40% PV : +100% ATK"},
            {id:"last_blast_1", n:"Explosion T1", d:"Dégâts de zone (40) à la mort"},
            {id:"last_blast_2", n:"Explosion T2", d:"Dégâts de zone (80) à la mort"},
            {id:"last_blast_3", n:"Explosion T3", d:"Dégâts de zone (120) à la mort"},
            {id:"vampire_1", n:"Vampire T1", d:"Vole 15% des dégâts en PV"},
            {id:"vampire_2", n:"Vampire T2", d:"Vole 30% des dégâts en PV"},
            {id:"vampire_3", n:"Vampire T3", d:"Vole 45% des dégâts en PV"},
            {id:"aura_atk_1", n:"Aura ATK T1", d:"Alliés proches : +15% ATK"},
            {id:"aura_atk_2", n:"Aura ATK T2", d:"Alliés proches : +30% ATK"},
            {id:"aura_atk_3", n:"Aura ATK T3", d:"Alliés proches : +45% ATK"},
            {id:"tank_1", n:"Tank T1", d:"Dégâts subis : -20%"},
            {id:"tank_2", n:"Tank T2", d:"Dégâts subis : -40%"},
            {id:"tank_3", n:"Tank T3", d:"Dégâts subis : -60%"},
            {id:"sniper_1", n:"Sniper T1", d:"Dégâts x1.5 si tir de loin"},
            {id:"sniper_2", n:"Sniper T2", d:"Dégâts x2.0 si tir de loin"},
            {id:"sniper_3", n:"Sniper T3", d:"Dégâts x2.5 si tir de loin"},
            {id:"dodge_1", n:"Esquive T1", d:"15% de chance d'éviter l'attaque"},
            {id:"dodge_2", n:"Esquive T2", d:"30% de chance d'éviter l'attaque"},
            {id:"dodge_3", n:"Esquive T3", d:"45% de chance d'éviter l'attaque"},
            {id:"clone_1", n:"Miroir T1", d:"Crée 1 clone (15 PV) ttes les 9s"},
            {id:"clone_2", n:"Miroir T2", d:"Crée 1 clone (30 PV) ttes les 7s"},
            {id:"clone_3", n:"Miroir T3", d:"Crée 1 clone (50 PV) ttes les 5s"},
            {id:"chain_1", n:"Chaîne T1", d:"Le tir rebondit sur 1 ennemi (50% dégâts)"},
            {id:"chain_2", n:"Chaîne T2", d:"Le tir rebondit sur 2 ennemis (50% dégâts)"},
            {id:"chain_3", n:"Chaîne T3", d:"Le tir rebondit sur 3 ennemis (50% dégâts)"},
            {id:"poison_1", n:"Venin T1", d:"L'ennemi perd 3 PV/s pendant 4s"},
            {id:"poison_2", n:"Venin T2", d:"L'ennemi perd 6 PV/s pendant 4s"},
            {id:"poison_3", n:"Venin T3", d:"L'ennemi perd 12 PV/s pendant 4s"}
        ];

        async function loadData() {
            const cb = "?t=" + Date.now();
            const [rShop, rStats] = await Promise.all([
                fetch('shop.json'+cb), 
                fetch('stats.json'+cb).then(res => res.json()).catch(() => ({}))
            ]);
            const shop = await rShop.json();
            const list = document.getElementById('editor-list');
            list.innerHTML = "";
            for(let id in shop) {
                const s = rStats[id] || {};
                let pOptions = powerList.map(p => `<option value="${p.id}" title="${p.d}" ${s.power===p.id?'selected':''}>${p.n}</option>`).join('');
                list.innerHTML += `
                    <div class="card-row" data-id="${id}">
                        <div style="font-size:10px; color:#888;">${id}</div>
                        <div style="font-weight:bold">${shop[id].nom}</div>
                        <div class="stat-group"><label>PV</label><input type="number" class="hp" value="${s.hp||100}"></div>
                        <div class="stat-group"><label>ATK</label><input type="number" class="atk" value="${s.atk||15}"></div>
                        <div class="stat-group"><label>RNG</label><input type="number" class="rng" value="${s.rng||2}"></div>
                        <div class="stat-group"><label>SPD</label><input type="number" class="spd" step="0.1" value="${s.spd||2.5}"></div>
                        <div class="stat-group"><label>AS (ms)</label><input type="number" class="as" value="${s.as||1000}"></div>
                        <div class="stat-group"><label>POUVOIR</label><select class="power">${pOptions}</select></div>
                    </div>`;
            }
        }

        function generateJSON() {
            let res = {};
            document.querySelectorAll('.card-row').forEach(row => {
                res[row.dataset.id] = {
                    hp: parseInt(row.querySelector('.hp').value),
                    atk: parseInt(row.querySelector('.atk').value),
                    rng: parseInt(row.querySelector('.rng').value),
                    spd: parseFloat(row.querySelector('.spd').value),
                    as: parseInt(row.querySelector('.as').value),
                    power: row.querySelector('.power').value
                };
            });
            document.getElementById('output').value = JSON.stringify(res, null, 4);
        }
        loadData();
    </script>
</body>
</html>
